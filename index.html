<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prep Desk">
<title>Prep Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Noto+Sans+Tamil:wght@400&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Direction: a study register. Ruled rows instead of cards, pen-ink blue, OMR-style bubbles for every tick. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#172033; --muted:#566178; --line:#D8DEE8;
  --accent:#2446D8; --accent-ink:#FFFFFF; --accent-soft:#E6EBFD;
  --ok:#16794C; --ok-soft:#DFF3E8; --warn:#8F5200; --warn-soft:#FFF0D1; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F141C; --surface:#171E29; --ink:#E8EDF5; --muted:#9AA6B8; --line:#2A3342;
    --accent:#8AA0FF; --accent-ink:#0F141C; --accent-soft:#1D2742;
    --ok:#5CCB93; --ok-soft:#14301F; --warn:#F0B35A; --warn-soft:#352610; --bad:#FF8A7D; --bad-soft:#3A1A17;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:46rem;margin:0 auto}
a{color:var(--accent)}
h1,h2,h3,p{margin:0}
h2{font-size:1.5rem;line-height:1.2;margin:1.25rem 0 .75rem;text-wrap:balance}
h3{font-size:1.0625rem;line-height:1.35}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:46rem;margin:0 auto}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:.9rem;border:0;background:transparent;color:var(--ink);padding:.45rem .8rem;min-height:40px;cursor:pointer}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:46rem;margin:6px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:.6rem .8rem;border-bottom:3px solid transparent;font-size:1rem}
.tab[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

/* controls */
label.f{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.25rem}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.55rem .65rem;min-height:44px}
textarea{min-height:5rem;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:.75rem}
@media(min-width:520px){.grid2{grid-template-columns:1fr 1fr}}
.stack{display:grid;gap:.75rem}
.btn{font:inherit;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;padding:.5rem .95rem;min-height:44px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:.25rem .65rem;font-size:.9rem;font-weight:400}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:.05rem .5rem;font-size:.85rem;color:var(--muted);background:var(--surface)}
button.chip{font:inherit;font-size:.9rem;padding:.3rem .7rem;min-height:36px;cursor:pointer;color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.subnav{display:flex;gap:.4rem;margin:.25rem 0 1rem;flex-wrap:wrap}
.note{color:var(--muted);font-size:.9rem}
.banner{background:var(--warn-soft);border-left:4px solid var(--warn);padding:.6rem .8rem;margin:.5rem 0 1rem;font-size:.95rem}
.empty{color:var(--muted);padding:1rem 0}
.chatbox{margin:.5rem 0}.chat{margin:.45rem 0;padding:.55rem .75rem;border-radius:4px;border:1px solid var(--line);background:var(--surface);max-width:92%;overflow-wrap:anywhere}.chat p{margin:0}.chat.me{margin-left:auto;background:var(--ok-soft);border-color:var(--ok)}.chat.sys{max-width:100%;color:var(--muted);font-size:.9rem}.chat .act{margin-top:.5rem;padding:.5rem;border:1px dashed var(--line);border-radius:3px}.chatin textarea{width:100%;box-sizing:border-box}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.9rem;margin:.75rem 0}

/* register rows */
.row{padding:.85rem 0;border-bottom:1px solid var(--line)}
.row:first-child{border-top:1px solid var(--line)}
.item p{margin-top:.3rem}
.item .why b{font-weight:700}
.item-head{display:flex;gap:.75rem;justify-content:space-between;align-items:flex-start}
.item-head h3{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.5rem}
.src{font-size:.85rem;color:var(--muted)}
.more{margin-top:.5rem}
.item-head .src{white-space:nowrap;flex:none}
.bar{margin-bottom:.6rem}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:.35rem 0}.bar i{display:block;height:100%;background:var(--accent)}
.chart{width:100%;max-width:420px;height:auto;margin:.5rem 0}.chart .gl{stroke:var(--line);stroke-width:1}.chart .gt{fill:var(--muted);font-size:10px}.chart .gp{fill:none;stroke:var(--accent);stroke-width:2}.chart .gd{fill:var(--accent)}
.detail{margin-top:.6rem;padding:.7rem .85rem;border-left:3px solid var(--accent);background:var(--surface)}
.detail h4{font-size:.95rem;margin:.7rem 0 .2rem}.detail h4:first-child{margin-top:0}
.detail ul{margin:.2rem 0 0 1.1rem;padding:0}.detail li{margin:.2rem 0}
.detail dl{margin:.2rem 0 0;display:grid;grid-template-columns:max-content 1fr;gap:.2rem .8rem}.detail dt{color:var(--muted)}.detail dd{margin:0;min-width:0}
.dg{margin-top:.4rem;overflow-x:auto;border:1px solid var(--line);border-radius:4px;padding:.5rem;background:var(--bg)}
.dg svg{max-width:100%;height:auto}.dg .mmsrc{display:none}
.dategroup{margin:1.25rem 0 .25rem;font-weight:700;font-size:1.0625rem;display:flex;justify-content:space-between;gap:1rem}
.dategroup span{font-weight:400;color:var(--muted);font-size:.9rem}
.saved-btn{font:inherit;font-size:.9rem;min-height:36px;padding:.2rem .6rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;cursor:pointer}
.saved-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}

/* OMR bubbles */
.tick{display:flex;align-items:flex-start;gap:.65rem;cursor:pointer;min-height:44px;padding:.25rem 0}
.tick input{position:absolute;opacity:0;width:1px;height:1px}
.bub{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:transparent;margin-top:2px;display:inline-block}
.tick input:checked+.bub{background:var(--ink)}
.tick input:focus-visible+.bub,.rev:focus-visible .bub{outline:3px solid var(--accent);outline-offset:2px}
.tick .tx{padding-top:3px}
.revs{display:flex;gap:.35rem;flex:0 0 auto}
.rev{font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;min-width:40px;min-height:44px;justify-content:center}
.rev .bub{width:18px;height:18px;border-width:2px;margin:0}
.rev .rl{font-size:.75rem}
.rev.done .bub{background:var(--ok);border-color:var(--ok)}
.rev.due .bub{border-color:var(--warn);border-width:4px}
.rev.due{color:var(--warn);font-weight:700}
.rev.wait .bub{border-style:dashed;border-color:var(--muted)}
.topicrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-bottom:1px solid var(--line)}
.topicrow .tick{flex:1;min-width:0}
details.set{border-top:2px solid var(--ink);margin:1rem 0}
details.set>summary{cursor:pointer;padding:.7rem 0;list-style:none;display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary b{font-size:1.125rem}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 .5rem}
.prog i{display:block;height:100%;background:var(--accent)}
.grouphead{font-weight:700;margin:1rem 0 .25rem}

/* deadlines */
.dl{display:flex;gap:1rem;align-items:flex-start}
.count{flex:0 0 5.2rem;text-align:left;line-height:1.1}
.count b{display:block;font-size:2rem}
.count span{font-size:.85rem;color:var(--muted)}
.count.soon b{color:var(--warn)}
.count.today b{color:var(--bad)}
.dl .body{flex:1;min-width:0}
.dl .body p{margin-top:.2rem}

/* tests */
.chart{width:100%;height:auto;max-width:34rem;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .dot{fill:var(--accent)}
.chart .axl{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .strong{fill:var(--ink);font-weight:700;font-size:11px}
.stats{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.5rem 0 1rem}
.stats div b{display:block;font-size:1.5rem;line-height:1.1}
.stats div span{font-size:.85rem;color:var(--muted)}

.res h3{margin-top:1.25rem}
.res ul{list-style:none;margin:.25rem 0 0;padding:0}
.res li{padding:.6rem 0;border-bottom:1px solid var(--line)}
.res li p{margin-top:.15rem}

.foot{max-width:46rem;margin:2.5rem auto 0;padding-top:1rem;border-top:2px solid var(--ink)}
.foot p{margin-bottom:.6rem}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:4px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#toast.on{opacity:1}
.printonly{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  .top,.foot,.noprint,#toast,.btn,.saved-btn{display:none!important}
  .printonly{display:block}
  a{color:#000;text-decoration:none}
  .item{break-inside:avoid;padding:.35rem 0}
  .row{border-color:#999}
  h2{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Pothi theme: palm-leaf manuscript, kumkum red, indigo ink ---- */
:root{
  --bg:#F6EBD2; --surface:#FBF3E0; --ink:#2B1D12; --muted:#6B5640; --line:#D9C59A;
  --accent:#9B2D1F; --accent-ink:#FFF8E8; --accent-soft:#F0D9B5;
  --gold:#B07A1A;
  --display:'Cormorant Garamond','Tiro Devanagari Sanskrit',Georgia,serif;
  --sans-verse:'Tiro Devanagari Sanskrit','Noto Sans Tamil',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1C140E; --surface:#261B12; --ink:#F1E3C6; --muted:#BFA982; --line:#463521;
  --accent:#E8896F; --accent-ink:#1C140E; --accent-soft:#3A2619; --gold:#E0B25A;}}
h2,.brand{font-family:var(--display);font-weight:700;letter-spacing:0}
h2{font-size:1.45rem;margin:1rem 0 .5rem}
h3{font-size:1rem;margin:1rem 0 .3rem;color:var(--accent)}
body{font-size:.95rem;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.top{border-bottom:2px solid var(--accent);padding-bottom:0}
.brand{font-size:1.45rem;color:var(--accent)}
.brand small{font-family:var(--sans-verse);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:.4rem}
.tabs{margin-top:2px}
.tabs:empty{display:none}
.tab{padding:.45rem .7rem;font-size:.95rem}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:2px solid var(--accent);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);padding:.65rem .2rem;font-size:.85rem;min-height:48px;border-top:3px solid transparent;margin-top:-2px}
.bnav a[aria-current="page"]{color:var(--accent);font-weight:700;border-top-color:var(--gold)}
.verse{margin:.6rem 0;padding:.9rem 1rem;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:2px;position:relative}
.verse blockquote{margin:0;font-family:var(--sans-verse);font-size:1.2rem;line-height:1.7;white-space:pre-line;color:var(--ink)}
.verse blockquote.roman{font-style:italic;font-size:1.05rem}
.verse .mean{margin-top:.4rem;color:var(--ink)}
.verse figcaption{margin-top:.4rem;color:var(--gold);font-size:.85rem;font-weight:700}
.verse .use{margin-top:.3rem;font-size:.85rem;color:var(--muted)}
.verse .papers{display:block;font-size:.8rem}
.verse .btn{margin-top:.5rem}
.filters{border:1px solid var(--line);border-radius:2px;margin:.4rem 0;background:var(--surface)}
.filters>summary{padding:.6rem .8rem;cursor:pointer;min-height:44px;font-weight:700;color:var(--accent)}
.filters>.stack{padding:0 .8rem .8rem}
.addbox{border:1px dashed var(--accent);border-radius:2px;margin:.8rem 0;background:transparent}
.addbox>summary{padding:.6rem .8rem;cursor:pointer;min-height:44px;font-weight:700;color:var(--accent)}
.addbox>form,.addbox>.stack{padding:0 .8rem .8rem}

.vbar{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 24px)}
.vbar[hidden]{display:none}
.vb{font:inherit;font-size:.9rem;min-height:44px;min-width:44px;padding:.3rem .8rem;border-radius:22px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;box-shadow:0 2px 6px rgba(43,29,18,.25)}
.vb.mic{background:var(--accent);color:var(--accent-ink);font-weight:700}
.vb.mic[aria-pressed="true"]{outline:3px solid var(--gold)}
.vnow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.25rem .6rem;font-size:.85rem;max-width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:4;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:.4rem .6rem;margin:.5rem 0}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* ---- tracker css ---- */
.wbars{display:flex;gap:6px;align-items:flex-end;height:104px;margin:.4rem 0 1rem}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.wb i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:2px 2px 0 0}
.wbl{font-size:.75rem;color:var(--muted);margin-top:2px}.wbv{font-size:.65rem;color:var(--muted);white-space:nowrap}
.hzrow{margin:.5rem 0}.hzname{font-size:.85rem;font-weight:700}.hzcells{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.hz{width:16px;height:16px;border-radius:3px;border:2px solid var(--line);background:transparent;display:inline-block}
.hz1{background:var(--accent);border-color:var(--accent)}.hzd{border-color:#c0392b;background:transparent}.hzp{box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 8px var(--gold)}
.hz1.hzp{box-shadow:inset 0 0 0 5px var(--accent),inset 0 0 0 8px var(--gold)}
.subbar{display:flex;align-items:center;gap:8px;margin:.3rem 0;font-size:.9rem}.subbar>.tl{flex:0 0 38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbw{flex:1;height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden}.sbw i{display:block;height:100%;background:var(--accent)}
.chip.good{}
</style>
</head>
<body>
<header class="top">
  <div class="bar-row">
    <div class="brand">Prep Desk<small lang="sa">विद्या</small></div>
    <div class="seg" role="group" aria-label="Exam focus">
      <button type="button" data-phase="SSC_ODISHA" aria-pressed="true">SSC + Odisha</button>
      <button type="button" data-phase="OPSC_UPSC" aria-pressed="false">OPSC + UPSC</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main class="wrap" id="view" tabindex="-1"><p class="empty">Loading.</p></main>
<footer class="foot noprint">
  <p class="note">Your applications, notes, scores and syllabus ticks are saved in this browser only. Export a backup now and then, and before you clear your browser data.</p>
  <div class="btnrow">
    <button type="button" class="btn small" id="export">Export backup</button>
    <label class="btn small" for="import" style="display:inline-flex;align-items:center">Import backup</label>
    <input class="sr" type="file" id="import" accept="application/json,.json">
    <button type="button" class="btn small danger" id="wipe">Erase all data</button>
  </div>
</footer>
<div class="vbar noprint" id="vbar" hidden></div>
<nav class="bnav noprint" id="bnav" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="banner">Prep Desk needs JavaScript to run.</p></noscript>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };
var uid = function(){ return Math.random().toString(36).slice(2, 10); };
var pad = function(n){ return String(n).padStart(2, '0'); };
var iso = function(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var parse = function(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
var todayD = function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
var dayDiff = function(a, b){ return Math.round((b - a) / 86400000); };
var fmt = function(s){ var d = parse(s); return d ? d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : ''; };
var fmtShort = function(s){ var d = parse(s); return d ? d.toLocaleDateString('en-IN', {day:'numeric', month:'short'}) : ''; };
var monthName = function(ym){ var p = ym.split('-'); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'}); };
var safeUrl = function(u){ return /^https?:\/\//i.test(u || '') ? u : '#'; };
var slug = function(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48); };
var num = function(v){ var n = parseFloat(v); return isNaN(n) ? null : n; };

var toastTimer;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 3200);
}

/* ---------- state ---------- */
var KEY = 'prepdesk.v1';
function defaults(){

var FLAT = null;
function flat(){
  if (FLAT) return FLAT;

    });
  });
  FLAT.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });

var MM = { state: 0, n: 0, q: [] };
function loadMermaid(cb){
  if (window.mermaid && MM.state === 3) return cb(true);
  if (MM.state === 2) return cb(false);
  if (MM.state === 1) { MM.q.push(cb); return; }
  MM.state = 1; MM.q = [cb];
  var sc = document.createElement('script');
  sc.src = MERMAID_SRC;
  sc.onload = function(){
    try { window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default', flowchart: { htmlLabels: false } }); MM.state = 3; } catch (e) { MM.state = 2; }
    MM.q.splice(0).forEach(function(f){ f(MM.state === 3); });
  };
  sc.onerror = function(){ MM.state = 2; MM.q.splice(0).forEach(function(f){ f(false); }); };
  document.head.appendChild(sc);
}
var MERMAID_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js';
function drawDiagrams(){
  var boxes = $$('.dg').filter(function(b){ return !b.querySelector('svg') && !b.dataset.done; });
  if (!boxes.length) return;
  loadMermaid(function(ok){
    boxes.forEach(function(b){
      var src = b.querySelector('.mmsrc'); if (!src || b.dataset.done) return;
      if (!ok) { b.dataset.done = '1'; b.insertAdjacentHTML('beforeend', '<p class="note">The diagram could not load. It needs an internet connection.</p>'); return; }
      var id = 'mm' + (++MM.n);
      window.mermaid.render(id, src.textContent).then(function(r){ b.dataset.done = '1'; b.insertAdjacentHTML('beforeend', r.svg); })
        .catch(function(){ b.dataset.done = '1'; var e = document.getElementById('d' + id); if (e) e.remove(); b.insertAdjacentHTML('beforeend', '<p class="note">This diagram could not be drawn. The notes above still apply.</p>'); });
    });
  });
}

    if (A.exams.size && it.exams && it.exams.length && !it.exams.some(function(x){ return A.exams.has(x); })) return false;

function resultsHTML(){

  }

var R = { q:'', gs:'', src:'', stype:'' };
function researchFlat(){
  var out = [];
  RESEARCH.forEach(function(w){ (w.items || []).forEach(function(it){ out.push(withNotes(Object.assign({}, it, { date: w.date, key: 'r|' + w.date + '|' + it.title }))); }); });
  out.sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  return out;
}
function researchHTML(){
  var q = R.q.trim().toLowerCase();
  var list = researchFlat().filter(function(it){
    if (R.gs && it.gs !== R.gs) return false;
    if (R.src && it.source !== R.src) return false;
    if (R.stype && it.stype !== R.stype) return false;
    if (R.stype && it.stype !== R.stype) return false;
    if (R.stype && it.stype !== R.stype) return false;
    if (q && (it.title + ' ' + (it.summary || '') + ' ' + (it.theme || '') + ' ' + (it.notes || []).join(' ') + ' ' + (it.key_terms || []).join(' ')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  if (!list.length) return '<p class="empty">' + (RESEARCH.length ? 'No items match these filters.' : 'Nothing here yet. The reports job runs every morning. You can also run it by hand from the Actions tab on GitHub.') + '</p>';
  var out = selBar();
  var names = { GS1: 'GS Paper 1: Society, Culture and Geography', GS2: 'GS Paper 2: Governance, Polity and IR', GS3: 'GS Paper 3: Economy, Environment and Security' };
  ['GS1','GS2','GS3'].forEach(function(g){
    var its = list.filter(function(it){ return it.gs === g; });
    if (!its.length) return;
    out += '<div class="dategroup"><div>' + esc(names[g]) + '</div><span>' + its.length + '</span></div>';
    out += its.map(function(it){
      return '<article class="row item"><div class="item-head"><h3>' + (hasMore(it) ? esc(it.title) : '<a href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>') + '</h3></div>' +
        (it.summary ? '<p>' + esc(it.summary) + '</p>' : '') +
        (it.mains_use ? '<p class="why"><b>Use in Mains:</b> ' + esc(it.mains_use) + '</p>' : '') +
        '<div class="meta"><span class="chip">' + esc(it.source) + '</span>' + (it.theme ? '<span class="chip">' + esc(it.theme) + '</span>' : '') + '<span class="src">' + esc(fmt(it.date)) + '</span></div>' +
        (hasMore(it) ? moreBtn(it.key, 'notes' + (it.diagram ? ' and diagram' : '')) + (OPEN[it.key] ? detailHTML(it) : '') : (it.status ? '<p class="note">No notes for this item: ' + esc(it.status) + '. Use the title to open the source.</p>' : '') + pickBtn(it)) + '</article>';
    }).join('');
  });
  if (!q && !R.gs && !R.src && !R.stype) RESEARCH.slice(0, 4).forEach(function(w){
    var oth = Array.isArray(w.others) ? w.others : []; if (!oth.length) return;
    out += '<details class="addbox noprint" data-set="roth|' + esc(w.date) + '"' + (OPEN['roth|' + w.date] ? ' open' : '') + '><summary>More reports, week of ' + esc(fmt(w.date)) + ' (' + oth.length + ')</summary><div style="padding:0 .8rem .8rem">' +
      oth.map(function(o){ return '<div class="row"><a href="' + esc(safeUrl(o.link)) + '" target="_blank" rel="noopener"><b>' + esc(o.title) + '</b></a>' + (o.summary ? '<p class="note">' + esc(o.summary.length > 200 ? o.summary.slice(0, 197) + '...' : o.summary) + '</p>' : '') + '<span class="src">' + esc((o.gs ? o.gs + ' | ' : '') + (o.source || '')) + '</span></div>'; }).join('') +
      '<p class="note">These were found but not picked for notes.</p></div></details>';
  });
  return out;
}

 { id:'cgl', name:'SSC CGL Tier 1', phase:'SSC_ODISHA', groups:[

 { id:'odpsc', name:'Odisha add-on for OPSC', phase:'OPSC_UPSC', groups:[

];
var REVS = [1, 7, 30];
function allTopics(){
  var out = [];
  SETS.forEach(function(s){
    s.groups.forEach(function(g){
      g[1].forEach(function(name){ out.push({ id: s.id + '.' + slug(g[0]) + '.' + slug(name), set: s.id, setName: s.name, group: g[0], name: name, custom: false }); });
    });
  });
  S.custom.forEach(function(c){ var s = SETS.filter(function(x){ return x.id === c.set; })[0]; out.push({ id: c.id, set: c.set, setName: s ? s.name : '', group: 'Added by you', name: c.name, custom: true }); });
  return out;
}
function revStates(st){
  if (!st || !st.done) return [];
  var age = dayDiff(parse(st.done), todayD());
  return REVS.map(function(d){ var done = !!st['r' + d]; return { d: d, done: done, due: !done && age >= d, inDays: d - age }; });
}
function dueList(){
  var out = [];
  allTopics().forEach(function(t){
    var st = S.syllabus[t.id];
    revStates(st).forEach(function(r){ if (r.due) out.push({ t: t, d: r.d, done: st.done }); });
  });
  out.sort(function(a, b){ return a.done < b.done ? -1 : 1; });
  return out;
}
function topicRow(t){
  var st = S.syllabus[t.id] || {};
  var revs = revStates(st).map(function(r){
    var cls = r.done ? 'done' : r.due ? 'due' : 'wait';
    var label = 'Day ' + r.d + ' revision, ' + (r.done ? 'done' : r.due ? 'due now' : 'due in ' + r.inDays + ' days');
    return '<button type="button" class="rev ' + cls + '" data-act="rev" data-id="' + esc(t.id) + '" data-d="' + r.d + '" data-fid="r:' + esc(t.id) + ':' + r.d + '" aria-label="' + esc(label) + '" aria-pressed="' + r.done + '"><span class="bub" aria-hidden="true"></span><span class="rl">' + r.d + 'd</span></button>';
  }).join('');
  return '<div class="topicrow"><label class="tick"><input type="checkbox" data-change="tick" data-id="' + esc(t.id) + '" data-fid="t:' + esc(t.id) + '"' + (st.done ? ' checked' : '') + '><span class="bub" aria-hidden="true"></span><span class="tx">' + esc(t.name) + '</span></label>' +
    (st.done ? '<div class="revs">' + revs + '</div>' : '') +
    (t.custom ? '<button type="button" class="btn small noprint" data-act="rmtopic" data-id="' + esc(t.id) + '" aria-label="Remove ' + esc(t.name) + '">Remove</button>' : '') + '</div>';
}
VIEWS.syllabus = function(){
  var topics = allTopics(), due = dueList();
  var out = '<h2>Syllabus tracker</h2>' +
    '<p class="note">Starter checklists based on common syllabus areas. Syllabi change by exam and year, so check the official notification and add or remove topics to match. Tick a topic when you have covered it, then tick the 1, 7 and 30 day revision circles as they fall due.</p>';
  out += '<h3 style="margin-top:1.25rem">Due for revision</h3>';
  if (!due.length) out += '<p class="empty">Nothing is due. Topics you cover will show up here at day 1, 7 and 30.</p>';
  else {
    out += due.slice(0, 8).map(function(x){
      return '<div class="row dl"><div class="body"><b>' + esc(x.t.name) + '</b><p class="note">Day ' + x.d + ' revision, covered ' + esc(fmt(x.done)) + '</p></div>' +
        '<button type="button" class="btn small" data-act="revdone" data-id="' + esc(x.t.id) + '" data-d="' + x.d + '" data-fid="rd:' + esc(x.t.id) + ':' + x.d + '">Mark revised</button></div>';
    }).join('');
    if (due.length > 8) out += '<p class="note" style="margin-top:.5rem">And ' + (due.length - 8) + ' more below.</p>';
  }
  var sets = SETS.slice().sort(function(a, b){ return (a.phase === S.phase ? 0 : 1) - (b.phase === S.phase ? 0 : 1); });
  sets.forEach(function(s){
    var mine = topics.filter(function(t){ return t.set === s.id; });
    var done = mine.filter(function(t){ return S.syllabus[t.id] && S.syllabus[t.id].done; }).length;
    var open = OPEN[s.id] !== undefined ? OPEN[s.id] : s.phase === S.phase;
    var pct = mine.length ? Math.round(done * 100 / mine.length) : 0;
    out += '<details class="set" data-set="' + s.id + '"' + (open ? ' open' : '') + '><summary><b>' + esc(s.name) + '</b><span class="note">' + done + ' of ' + mine.length + ' covered</span></summary>' +
      '<div class="prog" role="img" aria-label="' + pct + ' percent covered"><i style="width:' + pct + '%"></i></div>';
    var groupsSeen = [];
    mine.forEach(function(t){
      if (groupsSeen.indexOf(t.group) < 0) { groupsSeen.push(t.group); out += '<div class="grouphead">' + esc(t.group) + '</div>'; }
      out += topicRow(t);
    });
    out += '</details>';
  });
  out += '<form data-submit="addtopic" class="panel noprint"><h3>Add your own topic</h3><div class="grid2" style="margin-top:.6rem">' +
    '<div><label class="f" for="ts">List</label><select id="ts" name="set">' + SETS.map(function(s){ return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('') + '</select></div>' +
    '<div><label class="f" for="tn">Topic</label><input id="tn" name="name" type="text" required maxlength="90"></div></div>' +
    '<div class="btnrow" style="margin-top:.75rem"><button class="btn primary" type="submit">Add topic</button></div></form>';
  return out;
};
ACT.tick = function(el){
  var id = el.dataset.id;
  if (el.checked) S.syllabus[id] = { done: iso(todayD()) }; else delete S.syllabus[id];
  save(); redraw();
};
ACT.rev = function(el){
  var id = el.dataset.id, d = +el.dataset.d, st = S.syllabus[id]; if (!st) return;
  var r = revStates(st).filter(function(x){ return x.d === d; })[0];
  if (r.done) { delete st['r' + d]; }
  else if (r.due) { st['r' + d] = true; }
  else { toast('Day ' + d + ' revision is due in ' + r.inDays + ' days.'); return; }
  save(); redraw();
};
ACT.revdone = function(el){ var st = S.syllabus[el.dataset.id]; if (st) { st['r' + el.dataset.d] = true; save(); toast('Marked as revised.'); redraw(); } };
ACT.addtopic = function(f){
  var d = formData(f); if (!d.name) return;
  S.custom.push({ id: 'c.' + uid(), set: d.set, name: d.name }); save(); toast('Topic added.'); OPEN[d.set] = true; redraw();
};
ACT.rmtopic = function(el){
  var id = el.dataset.id; S.custom = S.custom.filter(function(c){ return c.id !== id; }); delete S.syllabus[id]; save(); redraw();
};

function icsText(s){ return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function makeICS(title, dateISO){
  var d = parse(dateISO), nx = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  var ymd = function(x){ return x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate()); };
  var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Prep Desk//EN','BEGIN:VEVENT','UID:' + uid() + '@prepdesk','DTSTAMP:' + stamp,
    'DTSTART;VALUE=DATE:' + ymd(d),'DTEND;VALUE=DATE:' + ymd(nx),'SUMMARY:' + icsText(title),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:' + icsText(title),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function download(name, text, type){
  var blob = new Blob([text], { type: type || 'text/plain' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function allDeadlines(){
  var out = S.deadlines.map(function(d){ return { id: d.id, title: d.title, date: d.date, type: d.type, src: 'manual' }; });
  S.apps.forEach(function(a){
    var name = a.exam + (a.post ? ' (' + a.post + ')' : '');
    if (a.lastDate && !a.appliedOn) out.push({ id: 'a1' + a.id, title: 'Last date to apply: ' + name, date: a.lastDate, type: 'Form last date', src: 'apply' });
    if (a.examDate) out.push({ id: 'a2' + a.id, title: 'Exam: ' + name, date: a.examDate, type: 'Exam', src: 'apply' });
  });
  return out.filter(function(d){ return parse(d.date); }).sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
}
function countHTML(date){
  var n = dayDiff(todayD(), parse(date));
  if (n === 0) return '<div class="count today"><b>Today</b></div>';
  if (n === 1) return '<div class="count soon"><b>Tomorrow</b></div>';
  if (n > 1) return '<div class="count' + (n <= 7 ? ' soon' : '') + '"><b>' + (n > 999 ? '999+' : n) + '</b><span>days to go</span></div>';
  return '<div class="count"><b>' + Math.abs(n) + '</b><span>' + (n === -1 ? 'day ago' : 'days ago') + '</span></div>';
}
function deadlineRow(d){
  return '<div class="row dl">' + countHTML(d.date) + '<div class="body"><b>' + esc(d.title) + '</b><p class="note">' + esc(fmt(d.date)) + '</p>' +
    '<div class="meta"><span class="chip">' + esc(d.type) + '</span>' + (d.src === 'apply' ? '<span class="src">from the Apply tab</span>' : '') + '</div>' +
    '<div class="btnrow noprint" style="margin-top:.5rem"><button type="button" class="btn small" data-act="ics" data-title="' + esc(d.title) + '" data-date="' + esc(d.date) + '">Add to calendar</button>' +
    (d.src === 'manual' ? '<button type="button" class="btn small danger" data-act="ddrm" data-id="' + esc(d.id) + '">Remove</button>' : '') + '</div></div></div>';
}

    }).join('');
  return out;
};

function addYears(d, n){ return new Date(d.getFullYear() + n, d.getMonth(), d.getDate()); }
function ageOn(dob, on){
  var y = on.getFullYear() - dob.getFullYear(), m = on.getMonth() - dob.getMonth(), d = on.getDate() - dob.getDate();
  if (d < 0) { m--; d += new Date(on.getFullYear(), on.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y: y, m: m, d: d };
}
function eligResult(el){
  var dob = parse(el.dob), cut = parse(el.cutoff), lim = num(el.limit);
  if (!dob || !cut) return '<p class="empty">Enter your date of birth and the cutoff date from the notification.</p>';
  if (cut < dob) return '<p class="banner">The cutoff date is before your date of birth. Check both dates.</p>';
  var a = ageOn(dob, cut), out = '<p><b>Your age on ' + esc(fmt(el.cutoff)) + ':</b> ' + a.y + ' years, ' + a.m + ' months, ' + a.d + ' days.</p>';
  if (lim !== null) {
    var L = lim + (num(el.relax) || 0);
    var last = new Date(addYears(dob, el.rule === 'below' ? L : L + 1).getTime() - 86400000);
    var over = dayDiff(last, cut);
    out += over <= 0
      ? '<p style="margin-top:.5rem"><span class="chip ok">Within the age limit</span> You stay within a limit of ' + L + ' years until ' + esc(fmt(iso(last))) + '.</p>'
      : '<p style="margin-top:.5rem"><span class="chip bad">Over the age limit</span> You crossed a limit of ' + L + ' years on ' + esc(fmt(iso(last))) + ', which is ' + over + ' days before the cutoff.</p>';
  }
  var min = num(el.min);
  if (min !== null) out += cut >= addYears(dob, min)
    ? '<p style="margin-top:.5rem"><span class="chip ok">Meets the minimum age of ' + min + '</span></p>'
    : '<p style="margin-top:.5rem"><span class="chip bad">Below the minimum age of ' + min + '</span> You reach it on ' + esc(fmt(iso(addYears(dob, min)))) + '.</p>';
  var used = num(el.used), allowed = num(el.allowed);
  if (used !== null && allowed !== null) out += '<p style="margin-top:.5rem"><b>Attempts left:</b> ' + Math.max(0, allowed - used) + ' of ' + allowed + '.</p>';
  return out;
}

function chart(pts){
  if (pts.length < 2) return '<p class="empty">Add two or more tests to see your trend.</p>';
  var W = 320, H = 150, L = 30, R = 10, T = 12, B = 22, w = W - L - R, h = H - T - B;
  var x = function(i){ return L + i * w / (pts.length - 1); }, y = function(p){ return T + h - (p / 100) * h; };
  var grid = [0, 50, 100].map(function(g){ return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" class="grid"/><text x="' + (L - 6) + '" y="' + (y(g) + 4) + '" text-anchor="end" class="axl">' + g + '</text>'; }).join('');
  var path = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.pct).toFixed(1); }).join(' ');

    '<path d="' + path + '" class="line"/>' + dots +

/* =====================================================
   VOICE: read aloud, spoken brief, spoken revision, voice commands.
   Uses the browser's own speech tools. Reads only text already on the site.
   ===================================================== */
var VKEY = 'prepdesk.voice';
var VO = { rate: 1, gen: 0, timer: 0, steps: [], i: 0, on: false, paused: false, title: '', rec: null, listening: false };
(function(){ try { var v = JSON.parse(localStorage.getItem(VKEY) || '{}'); if (v.rate >= 0.6 && v.rate <= 1.6) VO.rate = v.rate; } catch (e) {} })();
function vSave(){ try { localStorage.setItem(VKEY, JSON.stringify({ rate: VO.rate })); } catch (e) {} }
var CAN_SPEAK = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function pickVoice(){
  var vs = (typeof VOICES !== 'undefined' && VOICES.length) ? VOICES : []; if (!vs.length) { try { vs = speechSynthesis.getVoices() || []; } catch (e) {} }
  var order = ['en-IN', 'en_IN', 'en-GB', 'en-US', 'en'];
  for (var k = 0; k < order.length; k++) { var m = vs.filter(function(v){ return (v.lang || '').replace('_', '-').indexOf(order[k].replace('_', '-')) === 0; }); if (m.length) return m[0]; }
  return null;
}
function vChunks(text){
  var parts = String(text).replace(/\s+/g, ' ').match(/[^.!?;]+[.!?;]*/g) || [String(text)];
  var out = [], cur = '';
  parts.forEach(function(p){
    if ((cur + p).length > 170 && cur) { out.push(cur); cur = ''; }
    while (p.length > 170) { var cut = p.lastIndexOf(' ', 170); if (cut < 40) cut = 170; out.push((cur + p.slice(0, cut)).trim()); cur = ''; p = p.slice(cut); }
    cur += p;
  });
  if (cur.trim()) out.push(cur.trim());
  return out;
}
var VOICES = [];
try { VOICES = speechSynthesis.getVoices() || []; speechSynthesis.addEventListener('voiceschanged', function(){ VOICES = speechSynthesis.getVoices() || []; }); } catch (e) {}
function vSay(text, done){
  if (!CAN_SPEAK) { done(); return; }
  var gen = VO.gen, list = vChunks(text), n = 0, errShown = false;
  function step(){
    if (gen !== VO.gen) return;
    if (n >= list.length) { done(); return; }
    var piece = list[n++], moved = false, dog = 0;
    function go(){ if (moved || gen !== VO.gen) return; moved = true; clearTimeout(dog); step(); }
    var u = new SpeechSynthesisUtterance(piece);
    var v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-IN';
    u.rate = VO.rate; u.volume = 1;
    u.onend = go;
    u.onerror = function(e){ if (gen !== VO.gen) return; if (!errShown && e && e.error && e.error !== 'interrupted' && e.error !== 'canceled') { errShown = true; toast('Voice problem: ' + e.error + '. Check the phone volume and that a text-to-speech voice is installed.'); } go(); };
    // Some Android voices never report the end. Move on after a safe time.
    dog = setTimeout(go, Math.max(2500, (piece.length * 95) / VO.rate + 2500));
    try { speechSynthesis.speak(u); } catch (e) { go(); }
  }
  // A short gap after cancel() stops Android Chrome from dropping the first sentence.
  setTimeout(function(){ if (gen === VO.gen) step(); }, 180);
}
function vHalt(){ VO.gen++; clearTimeout(VO.timer); try { speechSynthesis.cancel(); } catch (e) {} }
function vStop(msg){ vHalt(); VO.on = false; VO.paused = false; VO.steps = []; VO.title = ''; vbar(); if (msg) toast(msg); }
function vRun(){
  vHalt();
  if (!VO.on) return;
  if (VO.i >= VO.steps.length) { var end = VO.steps.length ? 'That is all.' : ''; VO.on = false; vbar(); if (end) { vSay(end, function(){}); } return; }
  var s = VO.steps[VO.i], gen = VO.gen;
  vbar();
  vSay(s.say, function(){
    if (gen !== VO.gen) return;
    VO.timer = setTimeout(function(){ if (gen !== VO.gen) return; VO.i++; vRun(); }, s.wait || 350);
  });
}
function vPlay(title, steps){
  if (!CAN_SPEAK) { toast('This browser cannot read aloud.'); return; }
  if (!steps.length) { toast('Nothing to read here yet.'); return; }
  VO.title = title; VO.steps = steps; VO.i = 0; VO.on = true; VO.paused = false; vRun();
}
function vCardStart(i){ var c = VO.steps[i] ? VO.steps[i].card : 0; while (i > 0 && VO.steps[i - 1].card === c) i--; return i; }
function vNext(){ if (!VO.on) return; var c = VO.steps[VO.i].card; while (VO.i < VO.steps.length && VO.steps[VO.i].card === c) VO.i++; VO.paused = false; vRun(); }
function vPrev(){ if (!VO.on) return; var st = vCardStart(VO.i); if (st > 0 && VO.i === st) st = vCardStart(st - 1); VO.i = st; VO.paused = false; vRun(); }
function vRepeat(){ if (!VO.on) return; VO.i = vCardStart(VO.i); VO.paused = false; vRun(); }
function vPause(){ if (!VO.on) return; VO.paused = true; vHalt(); vbar(); }
function vResume(){ if (!VO.on) return; VO.paused = false; vRun(); }

/* what gets read */
function stepsFor(it){
  var c = 0, out = [{ say: it.title + '.', card: c++, wait: 500 }];
  if (it.summary) out.push({ say: it.summary, card: c++, wait: 500 });
  (it.notes || []).forEach(function(n){ out.push({ say: n, card: c++, wait: 500 }); });
  (it.key_terms || []).forEach(function(n){ out.push({ say: 'Key term. ' + n, card: c++, wait: 500 }); });
  return out;
}
function latestDay(){ var all = DIGEST ? flat() : [], d = all.length ? all[0].date : ''; return all.filter(function(x){ return x.date === d; }); }
function headlineSteps(n){
  var c = 0, out = [];
  latestDay().slice(0, n || 8).forEach(function(it){ out.push({ say: it.title + '.', card: c, wait: 300 }); if (it.summary) out.push({ say: it.summary, card: c, wait: 900 }); c++; });
  return out;
}
function dueText(){ var n = dueList().length; return n ? n + (n === 1 ? ' revision is' : ' revisions are') + ' due today or overdue.' : 'No revisions are due.'; }
function nextDateText(){
  var t = iso(todayD()), dl = allDeadlines().filter(function(d){ return d.date >= t; })[0];
  return dl ? 'Next date. ' + dl.title + ', in ' + dayDiff(todayD(), parse(dl.date)) + ' days.' : 'No dates are saved yet.';
}
function briefSteps(){
  var q = quoteOfDay(), c = 0, out = [{ say: 'Good day. Here is your brief.', card: c++, wait: 300 }, { say: 'Verse of the day. ' + q.meaning + ' From ' + q.ref + '.', card: c++, wait: 500 }, { say: dueText(), card: c++, wait: 300 }, { say: nextDateText(), card: c++, wait: 500 }];
  var h = headlineSteps(5); if (h.length) { out.push({ say: 'Latest headlines.', card: c++, wait: 300 }); h.forEach(function(s){ out.push({ say: s.say, card: c + s.card, wait: s.wait }); }); }
  return out;
}
function termCards(){
  var cutoff = Date.now() - 60 * 86400000, cards = [];
  flat().forEach(function(it){
    if (new Date(it.date).getTime() < cutoff) return;
    (it.key_terms || []).forEach(function(k){ var p = String(k).indexOf(':'); if (p > 1 && p < String(k).length - 3) cards.push({ term: k.slice(0, p).trim(), meaning: k.slice(p + 1).trim() }); });
  });
  for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
  return cards.slice(0, 15);
}
function reviseSteps(){
  var out = [], c = 0;
  termCards().forEach(function(k){ out.push({ say: 'What is ' + k.term + '?', card: c, wait: 6000 }); out.push({ say: k.term + '. ' + k.meaning, card: c, wait: 1200 }); c++; });
  return out;
}

/* voice commands */
var TAB_WORDS = [['today', 'today'], ['archive', 'archive'], ['news', 'archive'], ['research', 'research'], ['reports', 'reports'], ['report', 'reports'], ['syllabus', 'syllabus'], ['progress', 'progress'], ['tests', 'tests'], ['test', 'tests'], ['deadlines', 'deadlines'], ['dates', 'deadlines'], ['apply', 'apply'], ['applications', 'apply'], ['upsc', 'upsc'], ['resources', 'resources'], ['backup', 'resources']];
function say1(t){ vHalt(); VO.on = false; VO.steps = []; vbar(); vSay(t, function(){}); toast(t); }
function runCommand(raw){
  if (typeof aiVoiceHook === 'function' && aiVoiceHook(raw)) return;
  var t = ' ' + raw.toLowerCase().replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  function has(w){ return t.indexOf(' ' + w + ' ') >= 0; }
  function any(l){ return l.some(has); }
  if (any(['stop', 'quiet', 'cancel', 'enough'])) return vStop();
  if (any(['pause', 'wait', 'hold on'])) return vPause();
  if (any(['resume', 'continue', 'carry on', 'play'])) return VO.on ? vResume() : vPlay('Brief', briefSteps());
  if (any(['next', 'skip'])) return VO.on ? vNext() : say1('Nothing is playing.');
  if (any(['previous', 'back', 'go back'])) return VO.on ? vPrev() : say1('Nothing is playing.');
  if (any(['repeat', 'again', 'say that again'])) return VO.on ? vRepeat() : say1('Nothing is playing.');
  if (any(['faster', 'speed up'])) { VO.rate = Math.min(1.6, VO.rate + 0.15); vSave(); return say1('Faster.'); }
  if (any(['slower', 'slow down'])) { VO.rate = Math.max(0.6, VO.rate - 0.15); vSave(); return say1('Slower.'); }
  if (any(['brief', 'briefing', 'good morning', 'summary'])) return vPlay('Brief', briefSteps());
  if (any(['quiz', 'revise', 'revision', 'flashcards', 'flashcard', 'test me', 'quiz me'])) { var r = reviseSteps(); return r.length ? vPlay('Revision', r) : say1('There are no key terms saved yet. Run the daily digest first.'); }
  if (any(['due', 'revisions']) ) return say1(dueText());
  if (any(['deadline', 'deadlines']) && (has('next') || has('when') || has('what'))) return say1(nextDateText());
  if (any(['verse', 'quote', 'shloka', 'sloka'])) { var q = quoteOfDay(); return vPlay('Verse', [{ say: q.meaning + ' From ' + q.ref + '.', card: 0 }]); }
  if (any(['headlines', 'headline', 'news']) && (has('read') || has('tell') || has('play'))) { var h = headlineSteps(8); return h.length ? vPlay('Headlines', h) : say1('No headlines are loaded yet.'); }
  if (any(['open', 'go', 'show', 'goto'])) {
    for (var i = 0; i < TAB_WORDS.length; i++) if (has(TAB_WORDS[i][0])) { location.hash = TAB_WORDS[i][1]; return say1('Opening ' + tabName(TAB_WORDS[i][1]) + '.'); }
  }
  if (any(['help', 'commands'])) return say1('You can say: brief, read headlines, quiz me, what is due, next date, verse, next, previous, repeat, pause, resume, stop, faster, slower, or open and a section name.');
  if (AI.key) { location.hash = 'assistant'; return askAI(raw); }
  say1('I did not catch that. Say help to hear what you can say.');
}
function beep(f){ try { var C = window.AudioContext || window.webkitAudioContext, a = new C(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; g.gain.value = 0.05; o.connect(g); g.connect(a.destination); o.start(); setTimeout(function(){ o.stop(); a.close(); }, 120); } catch (e) {} }
function listen(){
  if (!SR) { toast('This browser cannot listen. Use Chrome on Android.'); return; }
  if (VO.listening) { try { VO.rec.stop(); } catch (e) {} return; }
  if (VO.on && !VO.paused) vPause(); else vHalt();
  var rec = new SR(); VO.rec = rec;
  rec.lang = 'en-IN'; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
  var got = false;
  rec.onstart = function(){ VO.listening = true; beep(880); vbar(); };
  rec.onresult = function(e){ got = true; var txt = e.results[0][0].transcript; toast('Heard: ' + txt); runCommand(txt); };
  rec.onerror = function(e){ VO.listening = false; vbar(); toast(e.error === 'network' ? 'Speech recognition needs an internet connection.' : e.error === 'service-not-allowed' || e.error === 'language-not-supported' ? 'This browser cannot recognise speech here. Use Chrome.' : e.error === 'not-allowed' ? 'Allow the microphone for this site in your browser settings.' : e.error === 'no-speech' ? 'I heard nothing. Tap Voice and try again.' : 'Voice error: ' + e.error); };
  rec.onend = function(){ VO.listening = false; vbar(); if (!got && VO.on && VO.paused) { /* stay paused */ } };
  try { rec.start(); } catch (e) { toast('Could not start the microphone.'); }
}
function vbar(){
  var b = $('#vbar'); if (!b) return;
  if (!CAN_SPEAK && !SR) { b.hidden = true; return; }
  b.hidden = false;
  var h = '';
  if (VO.on) h += '<span class="vnow" role="status">' + esc(VO.title) + (VO.paused ? ' (paused)' : '') + '</span>' +
    '<button type="button" class="vb" data-v="prev">Back</button>' +
    '<button type="button" class="vb" data-v="' + (VO.paused ? 'resume' : 'pause') + '">' + (VO.paused ? 'Play' : 'Pause') + '</button>' +
    '<button type="button" class="vb" data-v="next">Next</button>' +
    '<button type="button" class="vb" data-v="stop">Stop</button>';
  if (SR) h += '<button type="button" class="vb mic" data-v="mic" aria-pressed="' + VO.listening + '">' + (VO.listening ? 'Listening' : 'Voice') + '</button>';
  b.innerHTML = h;
}
document.addEventListener('click', function(e){
  var el = e.target.closest('#vbar [data-v]'); if (!el) return;
  ({ prev: vPrev, next: vNext, pause: vPause, resume: vResume, stop: function(){ vStop(); }, mic: listen })[el.dataset.v]();

function voicePanel(){

  return '<h3>Voice</h3>' + ok + '<div class="btnrow noprint"><button type="button" class="btn primary" data-act="vbrief">Brief me</button><button type="button" class="btn" data-act="vheads">Read headlines</button><button type="button" class="btn" data-act="vquiz">Quiz me on key terms</button></div>' +
    '<div class="grid2" style="margin-top:.6rem"><div><label class="f" for="vrate">Speaking speed</label><select id="vrate" data-change="vrate">' + [[0.7, 'Slow'], [0.85, 'Easy'], [1, 'Normal'], [1.2, 'Fast'], [1.45, 'Very fast']].map(function(r){ return '<option value="' + r[0] + '"' + (Math.abs(VO.rate - r[0]) < 0.08 ? ' selected' : '') + '>' + r[1] + '</option>'; }).join('') + '</select></div><div style="align-self:end"><button type="button" class="btn small" data-act="vtest">Test voice</button></div></div>' +
    '<details class="addbox noprint" data-set="vhelp"' + (OPEN.vhelp ? ' open' : '') + '><summary>What you can say</summary><p class="note" style="padding:0 .8rem .8rem">Tap Voice, wait for the beep, then say one command: brief, read headlines, quiz me, what is due, next date, verse, next, back, repeat, pause, resume, stop, faster, slower, or open and a section name such as open syllabus. The page must stay open with the screen on. Quiz mode asks for a term, waits six seconds, then reads the meaning copied from the article.</p></details>';

   NOTES ON DEMAND: choose items, GitHub builds the notes with Gemini
   ===================================================== */
var GHK = 'prepdesk.gh', GH = { repo: '', branch: 'main', token: '' };
try { var g0 = JSON.parse(localStorage.getItem(GHK) || '{}'); GH.repo = g0.repo || ''; GH.branch = g0.branch || 'main'; GH.token = g0.token || ''; } catch (e) {}
function ghSave(){ try { localStorage.setItem(GHK, JSON.stringify(GH)); } catch (e) {} }
function ghRepo(){
  if (GH.repo) return GH.repo;
  if (/\.github\.io$/.test(location.hostname)) return location.hostname.split('.')[0] + '/' + (location.pathname.split('/')[1] || location.hostname);
  return '';
}
function ghHeaders(extra){ var h = { Authorization: 'Bearer ' + GH.token, 'X-GitHub-Api-Version': '2022-11-28' }; for (var k in (extra || {})) h[k] = extra[k]; return h; }
function fetchNotes(){
  var ok = GH.token && ghRepo();
  var u = ok ? 'https://api.github.com/repos/' + ghRepo() + '/contents/data/notes.json?ref=' + encodeURIComponent(GH.branch || 'main') : 'data/notes.json?v=' + Date.now();
  return fetch(u, ok ? { headers: ghHeaders({ Accept: 'application/vnd.github.raw+json' }) } : {}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}
var pollTimer = 0;
function pollNotes(tries){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(function(){
    fetchNotes().then(function(n){
      if (n && typeof n === 'object') { NOTES = n; FLAT = null; }
      var pending = Object.keys(WAIT).filter(function(l){ return !(NOTES[l] && NOTES[l].at && new Date(NOTES[l].at).getTime() > WAITSTART); });
      if (!pending.length) { WAIT = {}; redraw(); toast('Notes are ready.'); return; }
      if (tries <= 0) { WAIT = {}; redraw(); toast('Still building. Reload the page in a minute or two.'); return; }
      pollNotes(tries - 1);
    });
  }, 20000);
}
var WAITSTART = 0;
ACT.pick = function(el){ var l = el.dataset.link; SEL[l] = !SEL[l]; if (!SEL[l]) delete SEL[l]; redraw(); };
ACT.copylinks = function(){
  var links = Object.keys(SEL).filter(function(k){ return SEL[k]; }).slice(0, 12);
  if (!links.length) return;
  var text = links.join('\n');
  try { navigator.clipboard.writeText(text).then(function(){ toast('Copied ' + links.length + ' links. In GitHub tap Run workflow and paste them.'); }, function(){ toast('Could not copy.'); }); } catch (e) { toast('Could not copy.'); }
};
ACT.clearsel = function(){ SEL = {}; redraw(); };
ACT.buildnotes = function(){
  var links = Object.keys(SEL).filter(function(k){ return SEL[k]; });
  if (!links.length) return;
  if (!GH.token || !ghRepo()) { toast('No token yet. Use Copy links and paste them in GitHub, or add a token in the Resources tab.'); location.hash = 'resources'; return; }
  var sent = links.slice(0, 12);
  if (links.length > 12) toast('Sent the first 12. Select the rest again after these finish.');
  WAITSTART = Date.now() - 60000;
  fetch('https://api.github.com/repos/' + ghRepo() + '/actions/workflows/notes.yml/dispatches', {
    method: 'POST', headers: ghHeaders({ Accept: 'application/vnd.github+json', 'content-type': 'application/json' }),
    body: JSON.stringify({ ref: GH.branch || 'main', inputs: { links: sent.join('\n') } })
  }).then(function(r){
    if (r.status === 204) {
      sent.forEach(function(l){ WAIT[l] = true; delete SEL[l]; });
      toast('Started. Notes appear in one to three minutes.'); redraw(); pollNotes(24);
    } else {
      var why = r.status === 401 ? 'The token is wrong or expired.' : r.status === 403 ? 'The token cannot start workflows. It needs Actions: Read and write.' : r.status === 404 ? 'Repository, branch or the file notes.yml was not found. Check the name in Resources.' : r.status === 422 ? 'GitHub refused it. Check the branch name and that notes.yml is in .github/workflows.' : 'GitHub answered ' + r.status + '.';
      toast(why);
    }
  }).catch(function(){ toast('Could not reach GitHub. Check your connection.'); });
};
ACT.ghrepo = function(el){ GH.repo = el.value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''); ghSave(); };
ACT.ghbranch = function(el){ GH.branch = el.value.trim() || 'main'; ghSave(); };
ACT.ghtoken = function(el){ GH.token = el.value.trim(); ghSave(); };
ACT.ghtest = function(){
  if (!GH.token || !ghRepo()) { toast('Enter the token first.'); return; }
  fetch('https://api.github.com/repos/' + ghRepo() + '/actions/workflows/notes.yml', { headers: ghHeaders({ Accept: 'application/vnd.github+json' }) }).then(function(r){
    toast(r.status === 200 ? 'Works. The notes workflow was found.' : r.status === 401 ? 'The token is wrong or expired.' : r.status === 404 ? 'Not found. Check the repository name, or add notes.yml to .github/workflows.' : 'GitHub answered ' + r.status + '.');
  }).catch(function(){ toast('Could not reach GitHub.'); });
};
function ghPanel(){
  return '<h3>Notes on request (GitHub token)</h3><p class="note">Choose items with Select for notes, then Build notes. Only those items go to Gemini. The token stays in this browser only.</p>' +
    '<div class="stack noprint"><div><label class="f" for="gh-repo">Repository (owner/name)</label><input id="gh-repo" type="text" placeholder="' + esc(ghRepo() || 'yourname/prep') + '" value="' + esc(GH.repo) + '" data-change="ghrepo" autocomplete="off"></div>' +
    '<div class="grid2"><div><label class="f" for="gh-br">Branch</label><input id="gh-br" type="text" value="' + esc(GH.branch) + '" data-change="ghbranch" autocomplete="off"></div>' +
    '<div><label class="f" for="gh-tk">Token</label><input id="gh-tk" type="password" value="' + esc(GH.token) + '" data-change="ghtoken" autocomplete="off"></div></div>' +
    '<div class="btnrow"><button type="button" class="btn" data-act="ghtest">Test</button></div>' +
    '<details class="addbox" data-set="ghhelp"' + (OPEN.ghhelp ? ' open' : '') + '><summary>How to make the token</summary><p class="note" style="padding:0 .8rem .8rem">On github.com open your profile picture, Settings, Developer settings, Personal access tokens, Fine-grained tokens, Generate new token. Name it Prep Desk. Choose Only select repositories and pick this repository. Under Repository permissions set Actions to Read and write, and Contents to Read-only. Generate, copy the token and paste it above. Add the file notes.yml to .github/workflows in the repository.</p></details></div>';
}

/* =====================================================
   AI ASSISTANT. Runs in this browser with your own Gemini key (kept in this browser only).
   It can read your data through fixed tools, and it can only QUEUE changes. You confirm each change, and every change can be undone.
   It never states facts about news, data or law from its own memory: it quotes your saved notes and shows the source.
   ===================================================== */
var AIK = 'prepdesk.ai', AICHAT = 'prepdesk.aichat';
var AI = { key: '', speak: false, model: '', upper: false, busy: false, msgs: [], hist: [], pending: {}, srcs: [], turn: [], quiz: null, text: '' };
try { var a0 = JSON.parse(localStorage.getItem(AIK) || '{}'); AI.key = a0.key || ''; AI.speak = !!a0.speak; AI.model = a0.model || ''; } catch (e) {}
try { AI.msgs = (JSON.parse(localStorage.getItem(AICHAT) || '[]') || []).slice(-30); } catch (e) {}
function aiSave(){ try { localStorage.setItem(AIK, JSON.stringify({ key: AI.key, speak: AI.speak, model: AI.model })); } catch (e) {} }
function chatSave(){ try { localStorage.setItem(AICHAT, JSON.stringify(AI.msgs.slice(-30).map(function(m){ return { role: m.role, text: m.text, srcs: m.srcs, actions: m.actions }; }))); } catch (e) {} }

var AI_MODELS = ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash'];

/* ---------- search over saved notes ---------- */
var STOP = 'the and for are was were with that this from have has had not but you your what when where which who how why about into over under than then them they their there been being will would could should can did does done its our out any all one two also more most some such only just may might must shall per via'.split(' ');
function toks(s){ return (String(s).toLowerCase().match(/[a-z0-9]{3,}/g) || []).filter(function(w){ return STOP.indexOf(w) < 0; }); }
function allNoteItems(){ return flat().concat(researchFlat()); }
function searchNotes(query, limit){
  var q = toks(query); if (!q.length) return [];
  var docs = [], df = {};
  allNoteItems().forEach(function(it){
    var sents = [];
    if (it.notes && it.notes.length) it.notes.forEach(function(n){ sents.push({ t: n, kind: 'note' }); });
    if (it.summary) sents.push({ t: it.summary, kind: it.notes && it.notes.length ? 'summary' : 'headline only' });
    (it.key_terms || []).forEach(function(k){ sents.push({ t: k, kind: 'key term' }); });
    sents.forEach(function(x){ var w = {}; toks(x.t + ' ' + it.title).forEach(function(z){ w[z] = (w[z] || 0) + 1; }); Object.keys(w).forEach(function(z){ df[z] = (df[z] || 0) + 1; }); docs.push({ it: it, x: x, w: w, titleW: toks(it.title) }); });
  });
  var N = Math.max(1, docs.length), scored = [];
  docs.forEach(function(d){
    var sc = 0, hit = 0;
    q.forEach(function(z){ if (d.w[z]) { hit++; sc += (1 + Math.log(1 + d.w[z])) * Math.log(1 + N / (1 + (df[z] || 0))); } if (d.titleW.indexOf(z) >= 0) sc += 0.5; });
    if (hit && hit >= Math.ceil(q.length / 2)) scored.push({ d: d, sc: sc * (hit / q.length) });
  });
  scored.sort(function(a, b){ return b.sc - a.sc; });
  var out = [], per = {};
  scored.forEach(function(s){ var k = s.d.it.key; per[k] = (per[k] || 0); if (out.length < (limit || 6) && per[k] < 3 && !out.some(function(o){ return o.text === s.d.x.t; })) { per[k]++; out.push({ it: s.d.it, text: s.d.x.t, kind: s.d.x.kind }); } });
  return out;
}
function addSrc(o){ AI.srcs.push(o); return AI.srcs.length; }

function T(name, desc, props, req){ var p = {}; Object.keys(props || {}).forEach(function(k){ p[k] = props[k]; }); return { name: name, description: desc, parameters: { type: 'object', properties: p, required: req || [] } }; }
var STR = { type: 'string' }, INT = { type: 'integer' };

/* ---------- the model call ---------- */
function systemPrompt(){
  var p = P(), now = new Date();
  return 'You are ' + (p.aname || 'Vidya') + ', the personal study assistant of ' + (p.name || 'an aspirant') + ', who is preparing for ' + (p.exam || 'Indian government exams') + ' (' + (S.phase === 'OPSC_UPSC' ? 'OPSC and UPSC phase' : 'SSC and Odisha exams phase') + '). Today is ' + iso(todayD()) + ', ' + now.toLocaleDateString('en-IN', { weekday: 'long' }) + ', India time.\n' +
    'RULES:\n1. Never state facts about news, laws, schemes, data, statistics or dates from your own memory. For any factual question call search_notes, get_headlines, get_datasets or get_facts, and use only what they return. Cite with the source number, like [3]. If nothing is found, say plainly that nothing is saved on it, and suggest selecting items for notes or checking the official source.\n' +
    '2. You may advise on study strategy, planning and time, using the user\'s own data from the tools. Call the tools instead of guessing about their progress, dues, deadlines, mocks or jobs.\n' +
    '3. Tools whose description says QUEUE only queue a change. The user confirms it on screen. Never say a change is done. Say what you queued and ask them to confirm.\n' +
    '4. For a day plan: call get_plan_inputs, then give at most 6 items that fit available_minutes_today, put revisions first, then near deadlines, then weak areas, then new topics. Then call add_tasks with those items.\n' +
    '5. Be brief and plain. No emoji. Short sentences. When listing, use lines starting with "- ". Dates in your tool calls are YYYY-MM-DD.\n' +
    '6. For job questions use get_jobs and repeat its status and reasons. Say these are first checks and the official notice decides.\n' +
    (p.mem && p.mem.length ? '7. Remembered about the user: ' + p.mem.map(function(m){ return m.text; }).join(' | ') + '\n' : '');
}
async function gcall(contents){
  var body = function(){ return JSON.stringify({ systemInstruction: { parts: [{ text: systemPrompt() }] }, contents: contents, tools: [{ functionDeclarations: declarations() }], toolConfig: { functionCallingConfig: { mode: 'AUTO' } }, generationConfig: { temperature: 0.3 } }); };
  var order = AI.model ? [AI.model].concat(AI_MODELS.filter(function(m){ return m !== AI.model; })) : AI_MODELS, errs = [];
  for (var k = 0; k < order.length; k++) {
    var model = order[k];
    for (var attempt = 0; attempt < 2; attempt++) {
      var r;
      try { r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(AI.key), { method: 'POST', headers: { 'content-type': 'application/json' }, body: body() }); }
      catch (e) { throw new Error('NETWORK'); }
      if (r.ok) { var j = await r.json(); if (AI.model !== model) { AI.model = model; aiSave(); } return j; }
      var txt = ''; try { txt = await r.text(); } catch (e) {}
      if (r.status === 400 && /api key|API_KEY/i.test(txt)) throw new Error('KEY');
      if (r.status === 400 && !AI.upper && /type|enum|schema|invalid value|unknown name/i.test(txt) && attempt === 0) { AI.upper = true; continue; }
      if (r.status === 429) { errs.push(model + ': busy'); break; }
      errs.push(model + ': HTTP ' + r.status + ' ' + trim(txt.replace(/\s+/g, ' '), 90)); break;
    }
  }

}
function friendly(e){
  var m = String(e && e.message || e);
  if (m === 'KEY') return 'Gemini rejected your key. Check it in Settings below.';
  if (m === 'NETWORK') return 'Could not reach Gemini. Check your connection.';
  if (/busy/.test(m) && !/HTTP/.test(m)) return 'Gemini\'s free limit is reached for now. Wait a minute and try again.';

}

function quizCards(topic){
  var cards = [], q = toks(topic || '');
  allNoteItems().forEach(function(it){
    if (!it.notes || !it.notes.length) return;
    if (q.length && !q.some(function(z){ return (it.title + ' ' + (it.topic || '') + ' ' + it.notes.join(' ')).toLowerCase().indexOf(z) >= 0; })) return;
    (it.key_terms || []).forEach(function(term){
      var hay = norm(term), s = it.notes.filter(function(n){ return norm(n).indexOf(hay) >= 0; })[0];
      if (s) cards.push({ term: term, sentence: s, title: it.title, link: it.link, key: hay + '|' + it.link });
    });
  });
  var seen = {}; cards = cards.filter(function(c){ if (seen[c.key]) return false; seen[c.key] = 1; return true; });
  for (var i = cards.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = cards[i]; cards[i] = cards[j]; cards[j] = t; }
  var miss = S.miss || {};
  cards.sort(function(a, b){ return ((miss[b.key] && miss[b.key].misses > miss[b.key].gots) ? 1 : 0) - ((miss[a.key] && miss[a.key].misses > miss[a.key].gots) ? 1 : 0); });
  return cards.slice(0, 10);
}
function norm(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

}
