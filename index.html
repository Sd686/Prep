<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prep Desk">
<title>Prep Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Noto+Sans+Tamil:wght@400&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Direction: a study register. Ruled rows instead of cards, pen-ink blue, OMR-style bubbles for every tick. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#172033; --muted:#566178; --line:#D8DEE8;
  --accent:#2446D8; --accent-ink:#FFFFFF; --accent-soft:#E6EBFD;
  --ok:#16794C; --ok-soft:#DFF3E8; --warn:#8F5200; --warn-soft:#FFF0D1; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F141C; --surface:#171E29; --ink:#E8EDF5; --muted:#9AA6B8; --line:#2A3342;
    --accent:#8AA0FF; --accent-ink:#0F141C; --accent-soft:#1D2742;
    --ok:#5CCB93; --ok-soft:#14301F; --warn:#F0B35A; --warn-soft:#352610; --bad:#FF8A7D; --bad-soft:#3A1A17;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:46rem;margin:0 auto}
a{color:var(--accent)}
h1,h2,h3,p{margin:0}
h2{font-size:1.5rem;line-height:1.2;margin:1.25rem 0 .75rem;text-wrap:balance}
h3{font-size:1.0625rem;line-height:1.35}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:46rem;margin:0 auto}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:.9rem;border:0;background:transparent;color:var(--ink);padding:.45rem .8rem;min-height:40px;cursor:pointer}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:46rem;margin:6px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:.6rem .8rem;border-bottom:3px solid transparent;font-size:1rem}
.tab[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

/* controls */
label.f{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.25rem}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.55rem .65rem;min-height:44px}
textarea{min-height:5rem;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:.75rem}
@media(min-width:520px){.grid2{grid-template-columns:1fr 1fr}}
.stack{display:grid;gap:.75rem}
.btn{font:inherit;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;padding:.5rem .95rem;min-height:44px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:.25rem .65rem;font-size:.9rem;font-weight:400}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:.05rem .5rem;font-size:.85rem;color:var(--muted);background:var(--surface)}
button.chip{font:inherit;font-size:.9rem;padding:.3rem .7rem;min-height:36px;cursor:pointer;color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.subnav{display:flex;gap:.4rem;margin:.25rem 0 1rem;flex-wrap:wrap}
.note{color:var(--muted);font-size:.9rem}
.banner{background:var(--warn-soft);border-left:4px solid var(--warn);padding:.6rem .8rem;margin:.5rem 0 1rem;font-size:.95rem}
.empty{color:var(--muted);padding:1rem 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.9rem;margin:.75rem 0}

/* register rows */
.row{padding:.85rem 0;border-bottom:1px solid var(--line)}
.row:first-child{border-top:1px solid var(--line)}
.item p{margin-top:.3rem}
.item .why b{font-weight:700}
.item-head{display:flex;gap:.75rem;justify-content:space-between;align-items:flex-start}
.item-head h3{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.5rem}
.src{font-size:.85rem;color:var(--muted)}
.more{margin-top:.5rem}
.item-head .src{white-space:nowrap;flex:none}
.bar{margin-bottom:.6rem}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:.35rem 0}.bar i{display:block;height:100%;background:var(--accent)}
.chart{width:100%;max-width:420px;height:auto;margin:.5rem 0}.chart .gl{stroke:var(--line);stroke-width:1}.chart .gt{fill:var(--muted);font-size:10px}.chart .gp{fill:none;stroke:var(--accent);stroke-width:2}.chart .gd{fill:var(--accent)}
.detail{margin-top:.6rem;padding:.7rem .85rem;border-left:3px solid var(--accent);background:var(--surface)}
.detail h4{font-size:.95rem;margin:.7rem 0 .2rem}.detail h4:first-child{margin-top:0}
.detail ul{margin:.2rem 0 0 1.1rem;padding:0}.detail li{margin:.2rem 0}
.detail dl{margin:.2rem 0 0;display:grid;grid-template-columns:max-content 1fr;gap:.2rem .8rem}.detail dt{color:var(--muted)}.detail dd{margin:0;min-width:0}
.dg{margin-top:.4rem;overflow-x:auto;border:1px solid var(--line);border-radius:4px;padding:.5rem;background:var(--bg)}
.dg svg{max-width:100%;height:auto}.dg .mmsrc{display:none}
.dategroup{margin:1.25rem 0 .25rem;font-weight:700;font-size:1.0625rem;display:flex;justify-content:space-between;gap:1rem}
.dategroup span{font-weight:400;color:var(--muted);font-size:.9rem}
.saved-btn{font:inherit;font-size:.9rem;min-height:36px;padding:.2rem .6rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;cursor:pointer}
.saved-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}

/* OMR bubbles */
.tick{display:flex;align-items:flex-start;gap:.65rem;cursor:pointer;min-height:44px;padding:.25rem 0}
.tick input{position:absolute;opacity:0;width:1px;height:1px}
.bub{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:transparent;margin-top:2px;display:inline-block}
.tick input:checked+.bub{background:var(--ink)}
.tick input:focus-visible+.bub,.rev:focus-visible .bub{outline:3px solid var(--accent);outline-offset:2px}
.tick .tx{padding-top:3px}
.revs{display:flex;gap:.35rem;flex:0 0 auto}
.rev{font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;min-width:40px;min-height:44px;justify-content:center}
.rev .bub{width:18px;height:18px;border-width:2px;margin:0}
.rev .rl{font-size:.75rem}
.rev.done .bub{background:var(--ok);border-color:var(--ok)}
.rev.due .bub{border-color:var(--warn);border-width:4px}
.rev.due{color:var(--warn);font-weight:700}
.rev.wait .bub{border-style:dashed;border-color:var(--muted)}
.topicrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-bottom:1px solid var(--line)}
.topicrow .tick{flex:1;min-width:0}
details.set{border-top:2px solid var(--ink);margin:1rem 0}
details.set>summary{cursor:pointer;padding:.7rem 0;list-style:none;display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary b{font-size:1.125rem}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 0 .5rem}
.prog i{display:block;height:100%;background:var(--accent)}
.grouphead{font-weight:700;margin:1rem 0 .25rem}

/* deadlines */
.dl{display:flex;gap:1rem;align-items:flex-start}
.count{flex:0 0 5.2rem;text-align:left;line-height:1.1}
.count b{display:block;font-size:2rem}
.count span{font-size:.85rem;color:var(--muted)}
.count.soon b{color:var(--warn)}
.count.today b{color:var(--bad)}
.dl .body{flex:1;min-width:0}
.dl .body p{margin-top:.2rem}

/* tests */
.chart{width:100%;height:auto;max-width:34rem;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .dot{fill:var(--accent)}
.chart .axl{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .strong{fill:var(--ink);font-weight:700;font-size:11px}
.stats{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.5rem 0 1rem}
.stats div b{display:block;font-size:1.5rem;line-height:1.1}
.stats div span{font-size:.85rem;color:var(--muted)}

.res h3{margin-top:1.25rem}
.res ul{list-style:none;margin:.25rem 0 0;padding:0}
.res li{padding:.6rem 0;border-bottom:1px solid var(--line)}
.res li p{margin-top:.15rem}

.foot{max-width:46rem;margin:2.5rem auto 0;padding-top:1rem;border-top:2px solid var(--ink)}
.foot p{margin-bottom:.6rem}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:4px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#toast.on{opacity:1}
.printonly{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  .top,.foot,.noprint,#toast,.btn,.saved-btn{display:none!important}
  .printonly{display:block}
  a{color:#000;text-decoration:none}
  .item{break-inside:avoid;padding:.35rem 0}
  .row{border-color:#999}
  h2{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Pothi theme: palm-leaf manuscript, kumkum red, indigo ink ---- */
:root{
  --bg:#F6EBD2; --surface:#FBF3E0; --ink:#2B1D12; --muted:#6B5640; --line:#D9C59A;
  --accent:#9B2D1F; --accent-ink:#FFF8E8; --accent-soft:#F0D9B5;
  --gold:#B07A1A;
  --display:'Cormorant Garamond','Tiro Devanagari Sanskrit',Georgia,serif;
  --sans-verse:'Tiro Devanagari Sanskrit','Noto Sans Tamil',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1C140E; --surface:#261B12; --ink:#F1E3C6; --muted:#BFA982; --line:#463521;
  --accent:#E8896F; --accent-ink:#1C140E; --accent-soft:#3A2619; --gold:#E0B25A;}}
h2,.brand{font-family:var(--display);font-weight:700;letter-spacing:0}
h2{font-size:1.45rem;margin:1rem 0 .5rem}
h3{font-size:1rem;margin:1rem 0 .3rem;color:var(--accent)}
body{font-size:.95rem;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.top{border-bottom:2px solid var(--accent);padding-bottom:0}
.brand{font-size:1.45rem;color:var(--accent)}
.brand small{font-family:var(--sans-verse);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:.4rem}
.tabs{margin-top:2px}
.tabs:empty{display:none}
.tab{padding:.45rem .7rem;font-size:.95rem}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:2px solid var(--accent);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);padding:.65rem .2rem;font-size:.85rem;min-height:48px;border-top:3px solid transparent;margin-top:-2px}
.bnav a[aria-current="page"]{color:var(--accent);font-weight:700;border-top-color:var(--gold)}
.verse{margin:.6rem 0;padding:.9rem 1rem;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:2px;position:relative}
.verse blockquote{margin:0;font-family:var(--sans-verse);font-size:1.2rem;line-height:1.7;white-space:pre-line;color:var(--ink)}
.verse blockquote.roman{font-style:italic;font-size:1.05rem}
.verse .mean{margin-top:.4rem;color:var(--ink)}
.verse figcaption{margin-top:.4rem;color:var(--gold);font-size:.85rem;font-weight:700}
.verse .use{margin-top:.3rem;font-size:.85rem;color:var(--muted)}
.verse .papers{display:block;font-size:.8rem}
.verse .btn{margin-top:.5rem}
.filters{border:1px solid var(--line);border-radius:2px;margin:.4rem 0;background:var(--surface)}
.filters>summary{padding:.6rem .8rem;cursor:pointer;min-height:44px;font-weight:700;color:var(--accent)}
.filters>.stack{padding:0 .8rem .8rem}
.addbox{border:1px dashed var(--accent);border-radius:2px;margin:.8rem 0;background:transparent}
.addbox>summary{padding:.6rem .8rem;cursor:pointer;min-height:44px;font-weight:700;color:var(--accent)}
.addbox>form,.addbox>.stack{padding:0 .8rem .8rem}

.vbar{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 24px)}
.vbar[hidden]{display:none}
.vb{font:inherit;font-size:.9rem;min-height:44px;min-width:44px;padding:.3rem .8rem;border-radius:22px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;box-shadow:0 2px 6px rgba(43,29,18,.25)}
.vb.mic{background:var(--accent);color:var(--accent-ink);font-weight:700}
.vb.mic[aria-pressed="true"]{outline:3px solid var(--gold)}
.vnow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.25rem .6rem;font-size:.85rem;max-width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:4;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:.4rem .6rem;margin:.5rem 0}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<header class="top">
  <div class="bar-row">
    <div class="brand">Prep Desk<small lang="sa">विद्या</small></div>
    <div class="seg" role="group" aria-label="Exam focus">
      <button type="button" data-phase="SSC_ODISHA" aria-pressed="true">SSC + Odisha</button>
      <button type="button" data-phase="OPSC_UPSC" aria-pressed="false">OPSC + UPSC</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main class="wrap" id="view" tabindex="-1"><p class="empty">Loading.</p></main>
<footer class="foot noprint">
  <p class="note">Your applications, notes, scores and syllabus ticks are saved in this browser only. Export a backup now and then, and before you clear your browser data.</p>
  <div class="btnrow">
    <button type="button" class="btn small" id="export">Export backup</button>
    <label class="btn small" for="import" style="display:inline-flex;align-items:center">Import backup</label>
    <input class="sr" type="file" id="import" accept="application/json,.json">
    <button type="button" class="btn small danger" id="wipe">Erase all data</button>
  </div>
</footer>
<div class="vbar noprint" id="vbar" hidden></div>
<nav class="bnav noprint" id="bnav" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="banner">Prep Desk needs JavaScript to run.</p></noscript>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };
var uid = function(){ return Math.random().toString(36).slice(2, 10); };
var pad = function(n){ return String(n).padStart(2, '0'); };
var iso = function(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var parse = function(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
var todayD = function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
var dayDiff = function(a, b){ return Math.round((b - a) / 86400000); };
var fmt = function(s){ var d = parse(s); return d ? d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : ''; };
var fmtShort = function(s){ var d = parse(s); return d ? d.toLocaleDateString('en-IN', {day:'numeric', month:'short'}) : ''; };
var monthName = function(ym){ var p = ym.split('-'); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('en-IN', {month:'long', year:'numeric'}); };
var safeUrl = function(u){ return /^https?:\/\//i.test(u || '') ? u : '#'; };
var slug = function(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48); };
var num = function(v){ var n = parseFloat(v); return isNaN(n) ? null : n; };

var toastTimer;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 3200);
}

/* ---------- state ---------- */
var KEY = 'prepdesk.v1';
function defaults(){
  return { phase:'SSC_ODISHA', syllabus:{}, custom:[], deadlines:[], apps:[], docs:{}, customDocs:[],
    elig:{dob:'', cutoff:'', limit:'', relax:'0', min:'', rule:'upto', used:'', allowed:''}, mocks:[], past:[], saved:[], pyq:{}, upscLinks:[], repNotes:{} };
}
function load(){
  try { var r = localStorage.getItem(KEY); var o = r ? JSON.parse(r) : {}; return Object.assign(defaults(), o); }
  catch (e) { return defaults(); }
}
var S = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('This browser blocked saving. Export a backup to keep your data.'); }
  if (typeof queueSync === 'function') queueSync();
}

/* ---------- data from n8n ---------- */
var NOTES = {}, DIGEST = null, NOTICES = [], RESEARCH = [], SAMPLE = false, OPEN = {};
var SAMPLE_DIGEST = [{ date: iso(todayD()), items: [
  { title:'Example entry: a new government scheme is announced', summary:'This is a sample. Real items appear here after the daily digest runs and saves its first file.', topic:'Schemes', gs:'GS2', exams:['SSC','OSSC/OSSSC'], link:'#archive', source:'sample', notes:['Real entries show up to eight sentences copied word for word from the article.','Each one is checked by code against the fetched page text.'], key_terms:['Outlay: money planned to be spent'], diagram:{ title:'How a scheme moves', type:'flowchart', code:'flowchart TD\nA["Cabinet approves"] --> B["Guidelines issued"]\nB --> C["States implement"]\nC --> D["Beneficiaries receive benefit"]' } },
  { title:'Example entry: a report on river pollution is released', summary:'This is a sample. Each real item has a two-sentence summary, a topic and exam tags.', topic:'Environment', exams:['UPSC','OPSC'], mains_angle:'In OPSC + UPSC mode, real items also carry a mains angle like this one.', link:'#archive', source:'sample' },
  { title:'Example entry: an Odisha cultural festival is recognised', summary:'This is a sample. Odisha items are tagged for OSSC, OSSSC and OPSC.', topic:'Odisha', exams:['OSSC/OSSSC','OPSC'], link:'#archive', source:'sample' }
]}];
function getJSON(p){
  return fetch(p + '?v=' + Date.now()).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}
function loadData(){
  return Promise.all([getJSON('data/digest.json'), getJSON('data/notices.json'), getJSON('data/research.json'), getJSON('data/notes.json')]).then(function(r){
    NOTES = r[3] && typeof r[3] === 'object' && !Array.isArray(r[3]) ? r[3] : {};
    RESEARCH = Array.isArray(r[2]) ? r[2] : [];
    DIGEST = Array.isArray(r[0]) && r[0].length ? r[0] : null;
    if (!DIGEST) { DIGEST = SAMPLE_DIGEST; SAMPLE = true; }
    NOTICES = Array.isArray(r[1]) ? r[1] : [];
  });
}
function withNotes(o){
  var n = NOTES[o.link]; if (!n) return o;
  if (n.notes && n.notes.length) { o.summary = n.summary || o.summary; o.notes = n.notes; o.key_terms = n.key_terms || []; o.diagram = n.diagram || null; o.full = n.full; delete o.status; }
  else if (n.status) o.status = n.status;
  return o;
}
var FLAT = null;
function flat(){
  if (FLAT) return FLAT;
  FLAT = [];
  (DIGEST || []).forEach(function(day){
    (day.items || []).forEach(function(it){
      FLAT.push(withNotes(Object.assign({}, it, { date: day.date, key: day.date + '|' + it.title })));
    });
  });
  FLAT.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  return FLAT;
}

/* ---------- routing and drawing ---------- */
var TABS = [['today','Today'],['archive','Archive'],['research','Research'],['reports','Reports'],['syllabus','Syllabus'],['progress','Progress'],['tests','Tests'],['deadlines','Deadlines'],['apply','Apply'],['upsc','UPSC'],['resources','Resources']];
var GROUPS = [['Today',['today']],['Read',['archive','research','reports']],['Plan',['syllabus','progress','tests']],['Dates',['deadlines','apply']],['UPSC',['upsc','resources']]];
var tab = 'today';
function groupOf(t){ return GROUPS.filter(function(g){ return g[1].indexOf(t) >= 0; })[0] || GROUPS[0]; }
function tabName(t){ return TABS.filter(function(x){ return x[0] === t; })[0][1]; }
var VIEWS = {}, AFTER = {}, ACT = {};

function draw(){
  var g = groupOf(tab);
  $('#tabs').innerHTML = g[1].length < 2 ? '' : g[1].map(function(t){
    return '<a class="tab" href="#' + t + '"' + (t === tab ? ' aria-current="page"' : '') + '>' + tabName(t) + '</a>';
  }).join('');
  $('#bnav').innerHTML = GROUPS.map(function(x){
    return '<a href="#' + x[1][0] + '"' + (x === g ? ' aria-current="page"' : '') + '>' + x[0] + '</a>';
  }).join('');
  $$('.seg button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.phase === S.phase)); });
  $('#view').innerHTML = VIEWS[tab]();
  if (AFTER[tab]) AFTER[tab]();
  if (typeof vbar === 'function') vbar();
}
function redraw(){
  var y = window.scrollY, a = document.activeElement, fid = a && a.dataset ? a.dataset.fid : null;
  draw(); window.scrollTo(0, y);
  if (fid) { var n = $('[data-fid="' + fid + '"]'); if (n) n.focus({preventScroll:true}); }
}
function route(){
  var h = (location.hash || '').slice(1);
  tab = TABS.some(function(t){ return t[0] === h; }) ? h : 'today';
  draw(); window.scrollTo(0, 0);
  var cur = $('.tab[aria-current]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({inline:'center', block:'nearest'});
}
window.addEventListener('hashchange', route);

var view = $('#view');
view.addEventListener('click', function(e){ var el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
view.addEventListener('change', function(e){ var el = e.target.closest('[data-change]'); if (el && ACT[el.dataset.change]) ACT[el.dataset.change](el, e); });
view.addEventListener('input', function(e){ var el = e.target.closest('[data-input]'); if (el && ACT[el.dataset.input]) ACT[el.dataset.input](el, e); });

function hasMore(it){ return !!((it.notes && it.notes.length) || (it.key_terms && it.key_terms.length) || it.diagram); }
function moreBtn(key, label){
  var open = !!OPEN[key];
  return '<button type="button" class="btn small more noprint" data-act="more" data-key="' + esc(key) + '" aria-expanded="' + open + '">' + (open ? 'Hide ' : 'Read ') + label + '</button>';
}
function detailHTML(it){
  var out = '<div class="detail">';
  out += '<button type="button" class="btn small noprint" data-act="listen" data-key="' + esc(it.key) + '">Listen to these notes</button>';
  if (it.notes && it.notes.length) out += '<h4>Notes</h4><ul>' + it.notes.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
  if (it.key_terms && it.key_terms.length) out += '<h4>Key terms</h4><ul>' + it.key_terms.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
  if (it.diagram && it.diagram.code) out += '<h4>' + esc(it.diagram.title || 'Diagram') + '</h4><div class="dg" role="img" aria-label="' + esc(it.diagram.title || 'Diagram') + '"><pre class="mmsrc">' + esc(it.diagram.code) + '</pre></div>';
  if (it.full === false) out += '<p class="note">The source text was short or not readable, so these notes are limited.</p>';
  if (it.link && it.link !== '#archive') out += '<p class="note">Source: <a href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener">' + esc(it.source || 'original page') + '</a>. Notes are sentences copied from the source. Topic, exam tags and diagram wording are chosen by AI and can be wrong.</p>';
  return out + '</div>';
}
var MM = { state: 0, n: 0, q: [] };
function loadMermaid(cb){
  if (window.mermaid && MM.state === 3) return cb(true);
  if (MM.state === 2) return cb(false);
  if (MM.state === 1) { MM.q.push(cb); return; }
  MM.state = 1; MM.q = [cb];
  var sc = document.createElement('script');
  sc.src = MERMAID_SRC;
  sc.onload = function(){
    try { window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default', flowchart: { htmlLabels: false } }); MM.state = 3; } catch (e) { MM.state = 2; }
    MM.q.splice(0).forEach(function(f){ f(MM.state === 3); });
  };
  sc.onerror = function(){ MM.state = 2; MM.q.splice(0).forEach(function(f){ f(false); }); };
  document.head.appendChild(sc);
}
var MERMAID_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js';
function drawDiagrams(){
  var boxes = $$('.dg').filter(function(b){ return !b.querySelector('svg') && !b.dataset.done; });
  if (!boxes.length) return;
  loadMermaid(function(ok){
    boxes.forEach(function(b){
      var src = b.querySelector('.mmsrc'); if (!src || b.dataset.done) return;
      if (!ok) { b.dataset.done = '1'; b.insertAdjacentHTML('beforeend', '<p class="note">The diagram could not load. It needs an internet connection.</p>'); return; }
      var id = 'mm' + (++MM.n);
      window.mermaid.render(id, src.textContent).then(function(r){ b.dataset.done = '1'; b.insertAdjacentHTML('beforeend', r.svg); })
        .catch(function(){ b.dataset.done = '1'; var e = document.getElementById('d' + id); if (e) e.remove(); b.insertAdjacentHTML('beforeend', '<p class="note">This diagram could not be drawn. The notes above still apply.</p>'); });
    });
  });
}
ACT.more = function(el){
  var k = el.dataset.key; if (OPEN[k]) delete OPEN[k]; else OPEN[k] = 1;
  if (tab === 'archive') setResults(); else redraw();
};
AFTER.archive = drawDiagrams; AFTER.research = drawDiagrams;

var EXAMS = ['SSC','OSSC/OSSSC','OPSC','UPSC'];
function defaultExams(p){ return p === 'OPSC_UPSC' ? ['OPSC','UPSC'] : ['SSC','OSSC/OSSSC']; }
var A = { q:'', exams:new Set(defaultExams(S.phase)), topic:'', mode:'day', month:'', saved:false, dg:false, gs:'', days:7, extra:{} };
var DAY_CAP = 100000;
function othersOf(date){ var d = (DIGEST || []).filter(function(x){ return x.date === date; })[0]; return d && Array.isArray(d.others) ? d.others : []; }

function filtered(){
  var q = A.q.trim().toLowerCase();
  return flat().filter(function(it){
    if (A.saved && S.saved.indexOf(it.key) < 0) return false;
    if (A.exams.size && it.exams && it.exams.length && !it.exams.some(function(x){ return A.exams.has(x); })) return false;
    if (A.topic && it.topic !== A.topic) return false;
    if (A.gs && it.gs !== A.gs) return false;
    if (A.dg && !(it.diagram && it.diagram.code)) return false;
    if (A.mode === 'month' && A.month && it.date.slice(0, 7) !== A.month) return false;
    if (q && (it.title + ' ' + (it.summary || '') + ' ' + (it.topic || '') + ' ' + (it.notes || []).join(' ') + ' ' + (it.key_terms || []).join(' ')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
var LASTV = 0;
try { LASTV = Number(localStorage.getItem('prepdesk.lastvisit') || 0); } catch (e) {}
function markVisit(){ try { localStorage.setItem('prepdesk.lastvisit', String(Date.now())); } catch (e) {} }
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') markVisit(); });
window.addEventListener('pagehide', markVisit);
function isNew(it){ return !!(it.at && LASTV && new Date(it.at).getTime() > LASTV); }
var SEL = {}, WAIT = {};
function pickBtn(it){
  if (hasMore(it) || !it.link || it.link.charAt(0) === '#') return '';
  if (WAIT[it.link]) return '<p class="note">Building notes. This takes one to three minutes.</p>';
  var on = !!SEL[it.link];
  return '<div class="noprint"><button type="button" class="btn small" data-act="pick" data-link="' + esc(it.link) + '" aria-pressed="' + on + '">' + (on ? 'Selected for notes' : it.status ? 'Try notes again' : 'Select for notes') + '</button></div>';
}
function selBar(){
  var n = Object.keys(SEL).filter(function(k){ return SEL[k]; }).length; if (!n) return '';
  return '<div class="selbar noprint"><b>' + n + ' selected</b><button type="button" class="btn primary small" data-act="buildnotes">Build notes (AI)</button><button type="button" class="btn small" data-act="clearsel">Clear</button></div>';
}
function itemHTML(it, compact){
  var saved = S.saved.indexOf(it.key) >= 0;
  var chips = (isNew(it) ? '<span class="chip" style="border-color:var(--gold);color:var(--gold);font-weight:700">New</span>' : '') + (it.topic ? '<span class="chip">' + esc(it.topic) + '</span>' : '') +
    (it.exams || []).map(function(x){ return '<span class="chip">' + esc(x) + '</span>'; }).join('') +
    (it.source ? '<span class="src">' + esc(it.source) + '</span>' : '');
  return '<article class="row item">' +
    '<div class="item-head"><h3>' + (hasMore(it) ? esc(it.title) : '<a href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>') + '</h3>' +
    '<button type="button" class="saved-btn noprint" data-act="star" data-key="' + esc(it.key) + '" aria-pressed="' + saved + '">' + (saved ? 'Saved' : 'Save') + '</button></div>' +
    (it.summary ? '<p>' + esc(it.summary) + '</p>' : '') +
    (!compact && it.why ? '<p class="why"><b>Why it matters:</b> ' + esc(it.why) + '</p>' : '') +
    (!compact && it.mains_angle ? '<p class="why"><b>Mains angle:</b> ' + esc(it.mains_angle) + '</p>' : '') +
    (compact ? '' : '<div class="meta">' + (it.gs ? '<span class="chip">' + esc(it.gs) + '</span>' : '') + chips + '</div>') +
    (hasMore(it) ? moreBtn(it.key, 'notes' + (it.diagram ? ' and diagram' : '')) + (OPEN[it.key] ? detailHTML(it) : '') : (it.status ? '<p class="note">No notes for this item: ' + esc(it.status) + '. Use the title to open the source.</p>' : '') + pickBtn(it)) +
    (compact && (it.exams || []).length ? '<p class="src">' + esc(it.exams.join(', ')) + '</p>' : '') +
    '</article>';
}
function resultsHTML(){
  var list = filtered();
  if (!list.length) {
    return '<p class="empty">' + (A.saved ? 'Nothing saved yet. Use Save on an item to collect it for revision.' : 'No items match these filters. Try All exams or clear the search.') + '</p>';
  }
  var out = selBar(), groups = {}, order = [];
  var by = A.mode === 'day' ? function(it){ return it.date; } : A.mode === 'gs' ? function(it){ return it.gs || 'Not tagged'; } : A.mode === 'source' ? function(it){ return it.source || 'Other'; } : function(it){ return it.topic || 'Other'; };
  list.forEach(function(it){ var k = by(it); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(it); });
  if (A.mode !== 'day') order.sort();
  if (A.mode === 'month') {
    out += '<h3 class="printonly">Revision sheet, ' + esc(monthName(A.month)) + '</h3>';
  }
  var narrowed = !!(A.q.trim() || A.saved || A.dg || A.topic || A.mode === 'month');
  var hiddenDays = 0;
  if (A.mode === 'day' && !narrowed && order.length > A.days) { hiddenDays = order.length - A.days; order = order.slice(0, A.days); }
  order.forEach(function(k){
    var head = A.mode === 'day' ? fmt(k) : k, arr = groups[k];
    var cap = narrowed ? arr.length : DAY_CAP + (A.extra[k] || 0), shown = arr.slice(0, cap), left = arr.length - shown.length;
    out += '<div class="dategroup"><div>' + esc(head) + '</div><span>' + arr.length + (arr.length === 1 ? ' item' : ' items') + '</span></div>';
    out += shown.map(function(it){ return itemHTML(it, A.mode === 'month'); }).join('');
    if (left > 0) out += '<div class="btnrow noprint" style="margin:.5rem 0"><button type="button" class="btn" data-act="showmore" data-k="' + esc(k) + '">Show ' + Math.min(left, DAY_CAP) + ' more (' + left + ' left)</button></div>';
    if (A.mode === 'day' && !narrowed) {
      var oth = othersOf(k);
      if (oth.length) out += '<details class="addbox noprint" data-set="oth|' + esc(k) + '"' + (OPEN['oth|' + k] ? ' open' : '') + '><summary>More headlines of this day (' + oth.length + ')</summary><div style="padding:0 .8rem .8rem">' +
        oth.map(function(o){ return '<div class="row"><a href="' + esc(safeUrl(o.link)) + '" target="_blank" rel="noopener"><b>' + esc(o.title) + '</b></a>' + (o.summary ? '<p class="note">' + esc(o.summary.length > 200 ? o.summary.slice(0, 197) + '...' : o.summary) + '</p>' : '') + '<span class="src">' + esc(o.source || '') + '</span></div>'; }).join('') +
        '<p class="note">These were fetched but not picked for notes.</p></div></details>';
    }
  });
  if (hiddenDays > 0) out += '<div class="btnrow noprint" style="margin:1rem 0"><button type="button" class="btn primary" data-act="olderdays">Show 7 older days (' + hiddenDays + ' more)</button></div>';
  return out;
}
VIEWS.archive = function(){

      '</div>' +
      '<div class="grid2">' +
        '<div><label class="f" for="atopic">Topic</label><select id="atopic" data-change="atopic"><option value="">All topics</option>' +
          Object.keys(topics).sort().map(function(t){ return '<option' + (A.topic === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div>' +

          [['day','Date'],['topic','Topic'],['gs','GS paper'],['source','Source'],['month','Month sheet']].map(function(m){ return '<option value="' + m[0] + '"' + (A.mode === m[0] ? ' selected' : '') + '>' + m[1] + '</option>'; }).join('') + '</select></div>' +

        '<div style="align-self:end"><button type="button" class="btn" data-act="print">Print this sheet</button></div></div>' : '') +

      '<label class="tick"><input type="checkbox" data-change="asaved"' + (A.saved ? ' checked' : '') + '><span class="bub" aria-hidden="true"></span><span class="tx">Show saved items only</span></label>' +
      '<div class="btnrow noprint"><button type="button" class="btn" data-act="notesdl">Download these notes as a text file</button></div>' +
    '</div></details>' +
    '<div id="aresults">' + resultsHTML() + '</div>';
};

var R = { q:'', gs:'', src:'' };
function researchFlat(){
  var out = [];
  RESEARCH.forEach(function(w){ (w.items || []).forEach(function(it){ out.push(withNotes(Object.assign({}, it, { date: w.date, key: 'r|' + w.date + '|' + it.title }))); }); });
  out.sort(function(a, b){ return a.date < b.date ? 1 : -1; });

function researchHTML(){
  var q = R.q.trim().toLowerCase();

    if (R.gs && it.gs !== R.gs) return false;

  });
  if (!list.length) return '<p class="empty">' + (RESEARCH.length ? 'No items match these filters.' : 'Nothing here yet. The reports job runs every morning. You can also run it by hand from the Actions tab on GitHub.') + '</p>';

    if (!its.length) return;
    out += '<div class="dategroup"><div>' + esc(names[g]) + '</div><span>' + its.length + '</span></div>';
    out += its.map(function(it){
      return '<article class="row item"><div class="item-head"><h3>' + (hasMore(it) ? esc(it.title) : '<a href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>') + '</h3></div>' +
        (it.summary ? '<p>' + esc(it.summary) + '</p>' : '') +

function revStates(st){

function icsText(s){ return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function makeICS(title, dateISO){
  var d = parse(dateISO), nx = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  var ymd = function(x){ return x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate()); };
  var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Prep Desk//EN','BEGIN:VEVENT','UID:' + uid() + '@prepdesk','DTSTAMP:' + stamp,
    'DTSTART;VALUE=DATE:' + ymd(d),'DTEND;VALUE=DATE:' + ymd(nx),'SUMMARY:' + icsText(title),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:' + icsText(title),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function download(name, text, type){
  var blob = new Blob([text], { type: type || 'text/plain' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function allDeadlines(){
  var out = S.deadlines.map(function(d){ return { id: d.id, title: d.title, date: d.date, type: d.type, src: 'manual' }; });

    if (a.examDate) out.push({ id: 'a2' + a.id, title: 'Exam: ' + name, date: a.examDate, type: 'Exam', src: 'apply' });
  });
  return out.filter(function(d){ return parse(d.date); }).sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
}
function countHTML(date){
  var n = dayDiff(todayD(), parse(date));

  if (n === 1) return '<div class="count soon"><b>Tomorrow</b></div>';
  if (n > 1) return '<div class="count' + (n <= 7 ? ' soon' : '') + '"><b>' + (n > 999 ? '999+' : n) + '</b><span>days to go</span></div>';
  return '<div class="count"><b>' + Math.abs(n) + '</b><span>' + (n === -1 ? 'day ago' : 'days ago') + '</span></div>';

function addYears(d, n){ return new Date(d.getFullYear() + n, d.getMonth(), d.getDate()); }
function ageOn(dob, on){
  var y = on.getFullYear() - dob.getFullYear(), m = on.getMonth() - dob.getMonth(), d = on.getDate() - dob.getDate();
  if (d < 0) { m--; d += new Date(on.getFullYear(), on.getMonth(), 0).getDate(); }

}
function eligResult(el){
  var dob = parse(el.dob), cut = parse(el.cutoff), lim = num(el.limit);
  if (!dob || !cut) return '<p class="empty">Enter your date of birth and the cutoff date from the notification.</p>';
  if (cut < dob) return '<p class="banner">The cutoff date is before your date of birth. Check both dates.</p>';
  var a = ageOn(dob, cut), out = '<p><b>Your age on ' + esc(fmt(el.cutoff)) + ':</b> ' + a.y + ' years, ' + a.m + ' months, ' + a.d + ' days.</p>';

    var L = lim + (num(el.relax) || 0);
    var last = new Date(addYears(dob, el.rule === 'below' ? L : L + 1).getTime() - 86400000);
    var over = dayDiff(last, cut);
    out += over <= 0
      ? '<p style="margin-top:.5rem"><span class="chip ok">Within the age limit</span> You stay within a limit of ' + L + ' years until ' + esc(fmt(iso(last))) + '.</p>'
      : '<p style="margin-top:.5rem"><span class="chip bad">Over the age limit</span> You crossed a limit of ' + L + ' years on ' + esc(fmt(iso(last))) + ', which is ' + over + ' days before the cutoff.</p>';
  }
  var min = num(el.min);
  if (min !== null) out += cut >= addYears(dob, min)
    ? '<p style="margin-top:.5rem"><span class="chip ok">Meets the minimum age of ' + min + '</span></p>'
    : '<p style="margin-top:.5rem"><span class="chip bad">Below the minimum age of ' + min + '</span> You reach it on ' + esc(fmt(iso(addYears(dob, min)))) + '.</p>';
  var used = num(el.used), allowed = num(el.allowed);

function chart(pts){
  if (pts.length < 2) return '<p class="empty">Add two or more tests to see your trend.</p>';
  var W = 320, H = 150, L = 30, R = 10, T = 12, B = 22, w = W - L - R, h = H - T - B;

  var path = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.pct).toFixed(1); }).join(' ');

function setPhaseOf(id){ var s = SETS.filter(function(x){ return x.id === id; })[0]; return s ? s.phase : null; }
function pctOf(m){ return m.max > 0 ? Math.round(m.score / m.max * 1000) / 10 : null; }

function mockChart(list){
  var pts = list.slice(-15).map(pctOf).filter(function(x){ return x !== null; });
  if (pts.length < 2) return '<p class="note">Add at least two tests to see a chart.</p>';
  var W = 320, H = 150, L = 30, R = 8, T = 8, B = 20, lo = Math.min(0, Math.min.apply(null, pts)), hi = Math.max(100, Math.max.apply(null, pts));
  var x = function(i){ return L + (W - L - R) * i / (pts.length - 1); }, y = function(v){ return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
  var grid = [0, 50, 100].map(function(v){ return '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gl"/><text x="' + (L - 4) + '" y="' + (y(v) + 4) + '" text-anchor="end" class="gt">' + v + '</text>'; }).join('');
  var line = pts.map(function(v, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
  var dots = pts.map(function(v, i){ return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="3.5" class="gd"/>'; }).join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Mock scores in percent, oldest to newest: ' + pts.join(', ') + '">' + grid + '<path d="' + line + '" class="gp"/>' + dots + '<text x="' + L + '" y="' + (H - 4) + '" class="gt">oldest</text><text x="' + (W - R) + '" y="' + (H - 4) + '" text-anchor="end" class="gt">latest</text></svg>';
}
VIEWS.progress = function(){
  var out = '<h2>Progress</h2><p class="note">Each measure is shown on its own with how it is worked out. Nothing here is a prediction. Syllabus coverage counts topics you ticked as done, not how well you know them.</p>';
  // 1. Syllabus
  var topics = allTopics().filter(function(t){ return setPhaseOf(t.set) === S.phase; });
  var done = topics.filter(function(t){ return S.syllabus[t.id] && S.syllabus[t.id].done; });
  var due = dueList().filter(function(x){ return setPhaseOf(x.t.set) === S.phase; });
  out += '<h3>Syllabus coverage</h3><p><b>' + done.length + ' of ' + topics.length + '</b> topics done' + (topics.length ? ' (' + Math.round(done.length / topics.length * 100) + '%)' : '') + '. Revisions due today or overdue: <b>' + due.length + '</b>.</p>' + bar(done.length, topics.length);
  var groups = {};
  topics.forEach(function(t){ var k = t.setName + ': ' + t.group; (groups[k] = groups[k] || { n: 0, d: 0 }); groups[k].n++; if (S.syllabus[t.id] && S.syllabus[t.id].done) groups[k].d++; });
  var gl = Object.keys(groups).map(function(k){ return { k: k, n: groups[k].n, d: groups[k].d, p: groups[k].d / groups[k].n }; }).sort(function(a, b){ return a.p - b.p; });
  out += gl.map(function(g){ return '<div class="row"><div class="item-head"><b>' + esc(g.k) + '</b><span class="src">' + g.d + ' of ' + g.n + '</span></div>' + bar(g.d, g.n) + '</div>'; }).join('');

    if (last3.length && prev3.length) { var df = Math.round((avgPct(last3) - avgPct(prev3)) * 10) / 10; out += '<p>Last 3 tests average <b>' + avgPct(last3) + '%</b>, which is <b>' + (df >= 0 ? 'up ' : 'down ') + Math.abs(df) + ' points</b> from the 3 before. With few tests this can be noise.</p>'; }
    out += mockChart(mocks);
    var types = {}; mocks.forEach(function(m){ (types[m.type] = types[m.type] || []).push(m); });
    out += Object.keys(types).sort().map(function(t){ return '<div class="row"><div class="item-head"><b>' + esc(t) + '</b><span class="src">' + types[t].length + ' tests, average ' + avgPct(types[t]) + '%</span></div></div>'; }).join('');
  }
  // 3. PYQ
  var tot = PYQ_YEARS.length * PYQ_PAPERS.length, dn = 0, untouched = [];
  PYQ_YEARS.forEach(function(y){ var c = 0; PYQ_PAPERS.forEach(function(p){ if (S.pyq[y + '.' + p[0]]) { c++; dn++; } }); if (!c) untouched.push(y); });
  out += '<h3>Mains PYQs</h3><p><b>' + dn + ' of ' + tot + '</b> paper-years ticked in the UPSC tab.' + (untouched.length && untouched.length < PYQ_YEARS.length ? ' Years with nothing ticked: ' + untouched.join(', ') + '.' : '') + '</p>' + bar(dn, tot);
  // 4. Exams appeared
  if (S.past.length) out += '<h3>Exams you have appeared in</h3><p><b>' + S.past.length + '</b> logged in the Tests tab.</p>';
  return out;
};


/* =====================================================
   AUTO BACKUP TO GOOGLE (Drive file + Sheet) through your own Apps Script
   ===================================================== */
var SYNC_KEY = 'prepdesk.sync';
var SY = (function(){ try { return Object.assign({ url:'', secret:'', on:false, last:'', lastOk:'', hash:'', msg:'' }, JSON.parse(localStorage.getItem(SYNC_KEY) || '{}')); } catch (e) { return { url:'', secret:'', on:false, last:'', lastOk:'', hash:'', msg:'' }; } })();
var syncTimer = null, syncBusy = false, restoreArmed = false;
function saveSY(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) {} }
function hashOf(str){ var h = 5381; for (var i = 0; i < str.length; i++) { h = ((h << 5) + h + str.charCodeAt(i)) | 0; } return String(h); }
function syncTables(){
  var t = {};
  t['Mocks'] = [['Date','Type','Name','Score','Max','Percent','Accuracy','Minutes','Notes']].concat(S.mocks.slice().sort(function(a, b){ return (a.date || '') < (b.date || '') ? -1 : 1; }).map(function(m){ return [m.date || '', m.type || '', m.name || '', m.score, m.max, m.max > 0 ? Math.round(m.score / m.max * 1000) / 10 : '', m.accuracy || '', m.minutes || '', m.notes || '']; }));
  t['Syllabus'] = [['Set','Group','Topic','Done on','Revision 1 day','Revision 7 days','Revision 30 days']].concat(allTopics().map(function(x){ var st = S.syllabus[x.id] || {}; return [x.setName, x.group, x.name, st.done || '', st.r1 ? 'yes' : '', st.r7 ? 'yes' : '', st.r30 ? 'yes' : '']; }));
  var py = [['Year','Essay','GS I','GS II','GS III','GS IV']];
  PYQ_YEARS.forEach(function(y){ py.push([y].concat(PYQ_PAPERS.map(function(p){ return S.pyq[y + '.' + p[0]] ? 'yes' : ''; }))); });
  t['Mains PYQ'] = py;
  t['Applications'] = [['Exam','Post','Application no','Applied on','Last date','Exam date','Fee','Admit card','Result','Notes']].concat(S.apps.map(function(a){ return [a.exam || '', a.post || '', a.appNo || '', a.appliedOn || '', a.lastDate || '', a.examDate || '', a.fee || '', a.admit || '', a.result || '', a.notes || '']; }));
  t['Exams appeared'] = [['Exam','Stage','Date','Result','Marks','Cutoff','Max','Notes']].concat(S.past.map(function(p){ return [p.exam || '', p.stage || '', p.date || '', p.result || '', p.marks || '', p.cutoff || '', p.max || '', p.notes || '']; }));
  t['Dates'] = [['Title','Date','Type']].concat(S.deadlines.map(function(d){ return [d.title || '', d.date || '', d.type || '']; }));
  return t;
}
function syncStatus(){
  if (!SY.url) return 'Not set up.';
  var out = SY.on ? 'Auto backup is on.' : 'Auto backup is off.';
  if (SY.lastOk) out += ' Last confirmed backup: ' + new Date(SY.lastOk).toLocaleString('en-IN') + '.';
  if (SY.msg) out += ' ' + SY.msg;
  return out;
}
function setSyncMsg(m){ SY.msg = m; saveSY(); var el = $('#syncstatus'); if (el) el.textContent = syncStatus(); }
function syncNow(manual){
  if (!SY.url || !SY.secret) { if (manual) toast('Add the web app address and secret first.'); return Promise.resolve(); }
  if (syncBusy) return Promise.resolve();
  var json = JSON.stringify(S), h = hashOf(json);
  if (!manual && h === SY.hash) return Promise.resolve();
  if (navigator.onLine === false) { setSyncMsg('Offline. Will try again after the next change.'); return Promise.resolve(); }
  syncBusy = true;
  var body = JSON.stringify({ secret: SY.secret, data: S, tables: syncTables() });
  return fetch(SY.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.ok) { SY.hash = h; SY.lastOk = new Date().toISOString(); SY.msg = ''; saveSY(); setSyncMsg(''); if (manual) toast('Backed up to Google Drive and Sheet.'); }
      else { setSyncMsg('Google refused the backup: ' + ((j && j.error) || 'unknown error') + '.'); if (manual) toast('Backup failed. See the message under the button.'); }
    })
    .catch(function(){ setSyncMsg('Could not reach the web app. Check the address, and that access is set to Anyone.'); if (manual) toast('Backup failed. See the message under the button.'); })
    .then(function(){ syncBusy = false; var el = $('#syncstatus'); if (el) el.textContent = syncStatus(); });
}
function queueSync(){
  if (!SY.on || !SY.url) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncNow(false); }, 20000);
}
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden' && SY.on && SY.url) { clearTimeout(syncTimer); syncNow(false); } });
window.addEventListener('online', function(){ queueSync(); });
function syncPanel(){
  return '<h3>Auto backup to Google</h3><p class="note">Sends a copy of your data to your own Google Drive and Sheet about 20 seconds after you change something, and when you leave the page. The copy goes only to the Google script you set up. Your address and secret are stored in this browser, not in the exported backup.</p>' +
    '<div class="stack noprint"><div><label class="f" for="sy-url">Web app address</label><input id="sy-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="' + esc(SY.url) + '" data-change="syurl" autocomplete="off"></div>' +
    '<div><label class="f" for="sy-sec">Secret</label><input id="sy-sec" type="password" value="' + esc(SY.secret) + '" data-change="sysecret" autocomplete="off"></div>' +
    '<label class="tick"><input type="checkbox" data-change="syon"' + (SY.on ? ' checked' : '') + '><span class="bub" aria-hidden="true"></span><span class="tx">Back up automatically</span></label>' +
    '<div class="btnrow"><button type="button" class="btn primary" data-act="syncnow">Back up now</button><button type="button" class="btn' + (restoreArmed ? ' danger' : '') + '" data-act="syncrestore">' + (restoreArmed ? 'Tap again to replace this phone\'s data' : 'Restore from Google') + '</button></div>' +
    '<p class="note" id="syncstatus" role="status">' + esc(syncStatus()) + '</p></div>';
}
ACT.syurl = function(el){ SY.url = el.value.trim(); SY.hash = ''; saveSY(); var s = $('#syncstatus'); if (s) s.textContent = syncStatus(); };
ACT.sysecret = function(el){ SY.secret = el.value; SY.hash = ''; saveSY(); };
ACT.syon = function(el){ SY.on = el.checked; saveSY(); if (SY.on) queueSync(); var s = $('#syncstatus'); if (s) s.textContent = syncStatus(); };
ACT.syncnow = function(){ syncNow(true); };
ACT.syncrestore = function(){
  if (!SY.url || !SY.secret) { toast('Add the web app address and secret first.'); return; }
  if (!restoreArmed) { restoreArmed = true; redraw(); setTimeout(function(){ if (restoreArmed) { restoreArmed = false; if (tab === 'resources') redraw(); } }, 6000); return; }
  restoreArmed = false;
  fetch(SY.url + (SY.url.indexOf('?') < 0 ? '?' : '&') + 'secret=' + encodeURIComponent(SY.secret))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || !j.ok || !j.data) { toast('Restore failed: ' + ((j && j.error) || 'no data') + '.'); redraw(); return; }
      S = Object.assign(defaults(), j.data); SY.hash = hashOf(JSON.stringify(S)); saveSY(); save(); toast('Restored from Google.'); redraw();
    })
    .catch(function(){ toast('Could not reach the web app.'); redraw(); });
};

/* =====================================================
   BACKUP
   ===================================================== */
$('#export').addEventListener('click', function(){ download('prep-desk-backup-' + iso(todayD()) + '.json', JSON.stringify(S, null, 2), 'application/json'); toast('Backup downloaded.'); });
$('#import').addEventListener('change', function(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try { var o = JSON.parse(r.result); if (!o || typeof o !== 'object') throw new Error('bad'); S = Object.assign(defaults(), o); save(); A.exams = new Set(defaultExams(S.phase)); toast('Backup restored.'); draw(); }
    catch (err) { toast('That file is not a Prep Desk backup.'); }
  };
  r.readAsText(f); e.target.value = '';
});
var wipeArmed = false, wipeTimer;
$('#wipe').addEventListener('click', function(){
  var b = $('#wipe');
  if (!wipeArmed) { wipeArmed = true; b.textContent = 'Tap again to erase everything'; wipeTimer = setTimeout(function(){ wipeArmed = false; b.textContent = 'Erase all data'; }, 4000); return; }
  clearTimeout(wipeTimer); wipeArmed = false; b.textContent = 'Erase all data';
  S = defaults(); save(); A.exams = new Set(defaultExams(S.phase)); toast('All data erased.'); draw();
});

/* ---------- start ---------- */
route();
loadData().then(function(){ FLAT = null; draw(); });
})();
</script>
