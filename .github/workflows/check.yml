name: Check sources
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check every source
        run: node scripts/check.mjs
      - name: Save data to the repository
        run: |
          git config user.name "prep-desk-bot"
          git config user.email "prep-desk-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Source check $(date -u +%F)"
            git pull --rebase
            git push
          fi
