name: Reports check
on:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHASE: ${{ vars.PHASE }}
          CONFIG_URL: ${{ vars.CONFIG_URL }}
        run: node scripts/weekly.mjs
      - name: Save data to the repository
        run: |
          git config user.name "prep-desk-bot"
          git config user.email "prep-desk-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Reports $(date -u +%F)"
            git pull --rebase
            git push
          fi
